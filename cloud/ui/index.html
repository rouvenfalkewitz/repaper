<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><meta name="theme-color" content="#0C100F">
<meta name="robots" content="noindex">
<title>RePaper Cloud</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600;62..125,700;62..125,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 6629.1 2338.6" role="img" aria-label="RePaper"><path class="ring" fill-rule="evenodd" d="M0 1169.3a1169.3 1169.3 0 1 0 2338.6 0a1169.3 1169.3 0 1 0 -2338.6 0ZM203.6 1169.3a965.7 965.7 0 1 0 1931.3 0a965.7 965.7 0 1 0 -1931.3 0Z"/><path class="letters" d="M355.9 1512.3V824.7H928.2Q1003.3 824.7 1052.6 855.6Q1101.8 886.5 1126.4 936.9Q1151 987.3 1151 1046.8Q1151 1112.2 1120.1 1165.7Q1089.1 1219.2 1026.9 1250.2L1167.5 1512.3H937.8L823.8 1283.6H559.5V1512.3ZM559.5 1133.1H861.7Q898.4 1133.1 920.4 1111.1Q942.3 1089 942.3 1052.5Q942.3 1027.9 932.4 1010.6Q922.5 993.4 904.6 984.5Q886.7 975.7 861.7 975.7H559.5Z M1257.9 1512.3V824.7H1974.7V975.7H1462.1V1091.1H1910.8V1237.2H1462.1V1361.4H1982.7V1512.3Z"/><path class="letters" d="M2489.5 1512.3V824.7H3020.1Q3087.7 824.7 3138.5 854.6Q3189.4 884.4 3217.7 937Q3246 989.7 3246 1058.4Q3246 1127.8 3217.2 1181.2Q3188.4 1234.6 3137.1 1264.1Q3085.7 1293.7 3018.3 1293.7H2693.1V1512.3ZM2693.1 1142.8H2961.6Q3006.8 1142.8 3030.2 1121Q3053.5 1099.3 3053.5 1059.4Q3053.5 1032.2 3042.9 1013.7Q3032.3 995.2 3012 985.4Q2991.6 975.7 2961.6 975.7H2693.1Z M3181.3 1512.3 3519.3 824.7H3745.7L4083.7 1512.3H3863.4L3811.5 1402.1H3442.5L3391.1 1512.3ZM3510.7 1253H3743.3L3680.7 1113.3Q3676.8 1103.9 3669.7 1086.8Q3662.7 1069.6 3655.1 1050.1Q3647.5 1030.6 3641.1 1013.8Q3634.7 997 3631.5 989H3624Q3616.7 1007.3 3607.1 1031.2Q3597.5 1055 3588.6 1077.4Q3579.7 1099.7 3573.3 1113.7Z M4153.5 1512.3V824.7H4684.1Q4751.7 824.7 4802.5 854.6Q4853.4 884.4 4881.7 937Q4910 989.7 4910 1058.4Q4910 1127.8 4881.2 1181.2Q4852.4 1234.6 4801.1 1264.1Q4749.7 1293.7 4682.3 1293.7H4357.1V1512.3ZM4357.1 1142.8H4625.6Q4670.8 1142.8 4694.2 1121Q4717.5 1099.3 4717.5 1059.4Q4717.5 1032.2 4706.9 1013.7Q4696.3 995.2 4676 985.4Q4655.6 975.7 4625.6 975.7H4357.1Z M4984.5 1512.3V824.7H5701.2V975.7H5188.7V1091.1H5637.4V1237.2H5188.7V1361.4H5709.2V1512.3Z M5817.5 1512.3V824.7H6389.7Q6464.9 824.7 6514.1 855.6Q6563.4 886.5 6588 936.9Q6612.6 987.3 6612.6 1046.8Q6612.6 1112.2 6581.7 1165.7Q6550.7 1219.2 6488.5 1250.2L6629.1 1512.3H6399.4L6285.3 1283.6H6021.1V1512.3ZM6021.1 1133.1H6323.3Q6360 1133.1 6381.9 1111.1Q6403.9 1089 6403.9 1052.5Q6403.9 1027.9 6394 1010.6Q6384.1 993.4 6366.1 984.5Q6348.2 975.7 6323.3 975.7H6021.1Z"/></svg>
    <div class="actions">
      <div class="who"><b id="orgName"></b><span id="userMail"></span></div>
      <button class="gear" onclick="signOut()" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg></button>
    </div>
  </header>

  <h2>Fleet</h2>
  <div class="fleet" id="fleet"></div>

  <h2>Team</h2>
  <div class="card" id="team"></div>
</div>

<dialog class="modal" id="edDlg">
  <div class="modal-head"><b id="edTitle"></b><button class="iconbtn" type="button" onclick="closeModal()" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="modal-body" id="edBody"></div>
</dialog>
<dialog class="modal" id="detDlg">
  <div class="modal-head"><b id="detName"></b><button class="iconbtn" type="button" onclick="el('detDlg').close()" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="modal-body" id="detBody"></div>
</dialog>
<div class="toast" id="toast" role="status"><span class="ic"></span><span class="tx"></span></div>

<script>
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const ICON = {
  check: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg>`,
  x: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
  spin: `<svg class="spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>`,
  pencil: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13 7 4 4"/></svg>`,
  info: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
  dock: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="9" rx="3"/><circle cx="12" cy="13.5" r="2"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg>`,
  phone: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>`,
  ping: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.2h.01"/><path d="M10 15.5a3 3 0 0 1 4 0"/><path d="M7.5 12.5a7 7 0 0 1 9 0"/><path d="M4.5 9.5a11 11 0 0 1 15 0"/></svg>`,
};
let S = { devices: [] }, toastT, firstLoad = true;

function toast(t, kind) { const x = el("toast"); x.querySelector(".tx").textContent = t; x.querySelector(".ic").innerHTML = kind === "err" ? ICON.x : ICON.check; x.className = "toast show " + (kind || ""); clearTimeout(toastT); toastT = setTimeout(() => x.classList.remove("show"), 2800); }
async function api(path, body) { const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {cache: "no-store"}); if (r.status === 401) { location.href = "/login"; throw new Error("signed out"); } const j = await r.json(); if (!r.ok || j.error) throw new Error(j.error || r.statusText); return j; }
function busy(b, label) {
  b.disabled = true; b.dataset.html = b.dataset.html || b.innerHTML; b.classList.add("busy"); b.innerHTML = ICON.spin + `<span>${label}</span>`;
  return (result, failed) => { b.classList.remove("busy"); if (!result) { b.innerHTML = b.dataset.html; b.disabled = false; return; }
    b.classList.add(failed ? "fail" : "ok"); b.innerHTML = (failed ? ICON.x : ICON.check) + `<span>${result}</span>`;
    setTimeout(() => { b.classList.remove("ok", "fail"); b.innerHTML = b.dataset.html; b.disabled = false; }, 1600); };
}
function shake(i) { i.classList.remove("shake"); void i.offsetWidth; i.classList.add("shake"); i.focus(); setTimeout(() => i.classList.remove("shake"), 400); }
const fact = (k, v) => v ? `<div class="fact"><i>${esc(k)}</i><b>${esc(v)}</b></div>` : "";
function ago(ts) {
  if (!ts) return "never";
  const m = Math.floor((Date.now() / 1000 - ts) / 60);
  if (m < 1) return "just now"; if (m < 60) return `${m} min ago`;
  if (m < 48 * 60) return `${Math.floor(m / 60)} h ago`;
  return new Date(ts * 1000).toLocaleDateString();
}

function card(d) {
  const st = d.status || {}, sheets = st.sheets || [], off = !d.online;
  const name = d.name || st.printer || (d.kind === "dock" ? "Dock" : "Go");
  const sheetsTxt = sheets.length ? `${sheets.length} sheet${sheets.length === 1 ? "" : "s"}` : "no sheets yet";
  return `<div class="dev ${off ? "off" : ""}" data-id="${esc(d.id)}">
    <div class="dev-top"><span class="kind">${d.kind === "dock" ? ICON.dock : ICON.phone}<span>${esc(d.kind)}</span></span>
      <span class="iconrow"><button class="iconbtn" data-act="name" title="Rename" aria-label="Rename">${ICON.pencil}</button><button class="iconbtn" data-act="details" title="Details" aria-label="Details">${ICON.info}</button><button class="iconbtn danger" data-act="remove" title="Remove" aria-label="Remove">${ICON.trash}</button></span></div>
    <b>${esc(name)}</b>
    <div class="devmeta">${esc(st.printer || "—")} · ${sheetsTxt}</div>
    <div class="dev-foot"><span class="presence ${off ? "off" : ""}"><span class="dot"></span><b>${off ? "seen " + ago(d.last_seen) : "online"}</b></span><span>${esc(d.version ? "v" + d.version : "")}</span></div>
    <div class="tools"><button class="btn small" data-act="identify" ${off ? "disabled" : ""}>${ICON.ping}Identify</button></div></div>`;
}

function render() {
  el("orgName").textContent = S.org || ""; el("userMail").textContent = (S.user || {}).email || "";
  el("fleet").innerHTML = S.devices.map(card).join("")
    + `<button class="addcard" type="button" onclick="openModal('claim')"><span class="plus">${ICON.plus}</span><span>${S.devices.length ? "Claim a device" : "Claim your first device"}</span></button>`
    + (S.devices.length ? "" : `<div class="empty-hint" style="grid-column:1/-1">A Dock shows its claim code on its settings page under <b>RePaper Cloud</b> once it is pointed at this cloud. Enter the code here and it joins your fleet.</div>`);
}

async function load() {
  S = { ...S, ...(await api("/api/fleet")) };
  if (!document.querySelector("dialog[open]")) render();   // don't repaint under an open modal
  firstLoad = false;
}

function openDetails(id) {
  const d = S.devices.find(x => x.id === id); if (!d) return;
  const st = d.status || {}, sheets = st.sheets || [];
  el("detName").textContent = d.name || st.printer || d.kind;
  api(`/api/devices/${id}`).then(full => {
    const rows = sheets.map(s => {
      const away = s.online === false, batt = s.battery_volts ? `${s.battery_volts.toFixed(2)} V` : "";
      const temp = (s.temperature_c ?? null) !== null ? `${s.temperature_c} °C` : "";
      return `<div class="dsheet ${away ? "away" : ""}"><b>${esc(s.name || s.id)}</b><span class="mono">${esc([s.size, batt, temp].filter(Boolean).join(" · "))}${away && s.seen ? " · seen " + ago(s.seen) : ""}</span></div>`;
    }).join("");
    const evts = (full.events || []).map(e => `<div class="evt"><span class="mono">${new Date(e.at * 1000).toLocaleString()}</span><span>${esc(e.type)}${e.data ? " · " + esc(e.data) : ""}</span></div>`).join("");
    el("detBody").innerHTML = `<div class="facts grid">${
      fact("Kind", d.kind) + fact("Printer", st.printer) + fact("Software", d.version) + fact("State", st.state)
      + fact("Reader", st.identifier) + fact("Jobs today", st.jobs_today != null ? String(st.jobs_today) : "")
      + fact("Local page", st.web) + fact("Claimed", d.claimed_at ? new Date(d.claimed_at * 1000).toLocaleDateString() : "")
      + fact("Last seen", d.online ? "online now" : ago(d.last_seen)) + fact("Device id", d.id)
    }</div>${sheets.length ? `<div><h2 style="margin-top:0">Sheets</h2><div class="dsheets">${rows}</div></div>` : ""}
    ${evts ? `<div><h2 style="margin-top:0">Activity</h2><div>${evts}</div></div>` : ""}`;
    el("detDlg").showModal();
  }).catch(x => toast(x.message, "err"));
}

/* team */
let T = null;
async function loadTeam() { try { T = await api("/api/team"); renderTeam(); } catch {} }
function renderTeam() {
  if (!T) return;
  const admin = (S.user || {}).role === "admin";
  const rows = T.users.map(u => `<div class="member"><span class="who2"><b>${esc(u.name || u.email)}${u.you ? " (you)" : ""}</b><span class="mono">${esc(u.email)}</span></span><span class="row" style="gap:8px"><span class="pill ${u.role === "admin" ? "" : "setup"}">${esc(u.role)}</span>${admin && !u.you ? `<button class="iconbtn danger" data-uid="${u.id}" data-name="${esc(u.name || u.email)}" data-act="kick" title="Remove">${ICON.trash}</button>` : ""}</span></div>`).join("");
  const inv = (T.invites || []).map(i => `<div class="member"><span class="who2"><b>${esc(i.email)}</b><span class="mono">invited by ${esc(i.invited_by_email)} · expires ${new Date(i.expires * 1000).toLocaleDateString()}</span></span><span class="row" style="gap:8px"><span class="pill amber">invited</span><button class="iconbtn danger" data-iid="${i.id}" data-act="revoke" title="Revoke invitation">${ICON.x}</button></span></div>`).join("");
  el("team").innerHTML = rows + inv
    + (admin ? `<div class="row" style="margin-top:14px"><button class="btn outline small" onclick="openModal('invite')">${ICON.plus}Invite someone</button></div>`
             : `<div class="hint" style="margin-top:10px;color:var(--text-3);font-size:.8125rem">Admins can invite and remove people.</div>`);
}
async function copyInv(link) { try { await navigator.clipboard.writeText(link); toast("Link copied."); } catch { toast("Copy failed — select it by hand.", "err"); } }
el("team").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "kick") return openKick(b.dataset.uid, b.dataset.name);
  if (b.dataset.act === "revoke") {
    try { await api(`/api/invites/${b.dataset.iid}/revoke`, {}); toast("Invitation revoked."); loadTeam(); }
    catch (x) { toast(x.message, "err"); }
  }
});
function openKick(uid, name) {
  setModal("Remove from team", `<form class="ed" data-ed="kick" data-uid="${esc(uid)}"><p>Remove <b>${esc(name)}</b> from this organisation? Their account is deleted; devices stay in the fleet. You can invite them again any time.</p><div class="row end"><button class="btn outline" type="button" data-act="close">Keep</button><button class="btn danger" type="submit">${ICON.trash}Remove</button></div></form>`);
}

/* modals: claim, rename, remove, invite */
const modals = {
  invite: () => ["Invite someone", `<form class="ed" data-ed="invite">
    <p>They get a one-time link (valid 14 days) and pick their own password. No invitation, no account — that's the whole door.</p>
    <label for="edMail">Email</label><input id="edMail" name="email" type="email" required autocomplete="off" placeholder="name@company.com">
    <label class="checkline"><input type="checkbox" name="admin"> Can manage the team (admin)</label>
    <div class="row end"><button class="btn outline" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Invite</button></div></form>`],
  claim: () => ["Claim a device", `<form class="ed" data-ed="claim">
    <p>On the Dock, open <b>Settings → RePaper Cloud</b> and point it at this cloud. Its claim code appears there.</p>
    <label for="edCode">Claim code</label><input id="edCode" name="value" class="serial" placeholder="3F9A-B2C1" maxlength="9" required autocomplete="off" style="font-family:var(--font-mono);text-transform:uppercase">
    <div class="row end"><button class="btn outline" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Claim</button></div></form>`],
  name: (d) => ["Rename", `<form class="ed" data-ed="name" data-id="${esc(d.id)}"><label for="edName">Name</label><input id="edName" name="value" value="${esc(d.name || (d.status || {}).printer || "")}" maxlength="63" required autocomplete="off"><div class="row end"><button class="btn outline" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>`],
  remove: (d) => ["Remove device", `<form class="ed" data-ed="remove" data-id="${esc(d.id)}"><p>Remove <b>${esc(d.name || (d.status || {}).printer || d.id)}</b> from this fleet? The device keeps working on its own and can be claimed again with a fresh code.</p><div class="row end"><button class="btn outline" type="button" data-act="close">Keep</button><button class="btn danger" type="submit">${ICON.trash}Remove</button></div></form>`],
};
function setModal(title, html) {
  el("edTitle").textContent = title; el("edBody").innerHTML = html; el("edDlg").showModal();
  const i = el("edBody").querySelector("input"); if (i) { i.focus(); i.select && i.select(); }
}
function openModal(kind, id) {
  const d = S.devices.find(x => x.id === id) || {};
  const [title, html] = modals[kind](d);
  setModal(title, html);
}
function closeModal() { el("edDlg").close(); render(); }
el("edDlg").addEventListener("click", e => { if (e.target === el("edDlg")) return closeModal(); const b = e.target.closest("[data-act=close]"); if (b) closeModal(); });
el("detDlg").addEventListener("click", e => { if (e.target === el("detDlg")) el("detDlg").close(); });
el("edDlg").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, kind = f.dataset.ed, id = f.dataset.id, sb = f.querySelector("button[type=submit]");
  const done = busy(sb, {claim: "Claiming…", name: "Saving…", remove: "Removing…", invite: "Inviting…", kick: "Removing…"}[kind]);
  try {
    if (kind === "invite") {
      const email = f.elements.email.value.trim();
      const r = await api("/api/invites", {email, role: f.elements.admin.checked ? "admin" : "member"});
      loadTeam();
      el("edBody").innerHTML = `<div class="ed"><p><b>Invitation created for ${esc(email)}.</b> ${r.mailed ? "An email with the link is on its way." : "Mail sending is off for now — pass them the link yourself:"}</p>
        <div class="linkbox mono">${esc(r.link)}</div>
        <div class="row end"><button class="btn outline" type="button" onclick="copyInv('${esc(r.link)}')">Copy link</button><button class="btn primary" type="button" data-act="close">Done</button></div></div>`;
      return;
    }
    if (kind === "kick") {
      await api(`/api/team/${f.dataset.uid}/remove`, {});
      el("edDlg").close(); toast("Removed from the team."); loadTeam(); return;
    }
    if (kind === "claim") {
      const r = await api("/api/claim", {code: f.elements.value.value});
      done("Claimed"); await load(); toast(`${r.device.name || "Device"} joined the fleet.`); await wait(400); closeModal();
      const c = el("fleet").querySelector(`[data-id="${CSS.escape(r.device.id)}"]`); if (c) c.classList.add("enter", "hi");
      return;
    }
    if (kind === "remove") { await api(`/api/devices/${id}/remove`, {}); el("edDlg").close(); const c = el("fleet").querySelector(`[data-id="${CSS.escape(id)}"]`); if (c) { c.classList.add("leave"); await wait(240); } toast("Removed."); await load(); render(); return; }
    await api(`/api/devices/${id}`, {name: f.elements.value.value.trim()}); done("Saved"); await load(); toast("Renamed."); await wait(400); closeModal();
  } catch (x) { done(kind === "claim" ? "Not claimed" : "Failed", true); const i = f.querySelector("input"); if (i) shake(i); toast(x.message, "err"); }
});
el("fleet").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.closest(".dev").dataset.id, act = b.dataset.act;
  if (act === "details") return openDetails(id);
  if (modals[act]) return openModal(act, id);
  if (act === "identify") {
    const done = busy(b, "Pinging…");
    try { await api(`/api/devices/${id}/identify`, {}); done("Sent"); toast("The device says hi — watch its ring / log."); }
    catch (x) { done("Failed", true); toast(x.message, "err"); }
  }
});
async function signOut() { try { await api("/api/logout", {}); } catch {} location.href = "/login"; }

load().then(loadTeam).catch(x => { if (x.message !== "signed out") toast(x.message, "err"); });
setInterval(() => load().catch(() => {}), 5000);
</script>
</body>
</html>
