<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><meta name="theme-color" content="#0C100F">
<meta name="robots" content="noindex">
<title>RePaper Cloud · Sheets</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600;62..125,700;62..125,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/app.css">
</head>
<body data-page="sheets">
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="pagehead"><h1>Sheets</h1><span class="mono" id="count"></span></div>
    <div class="card tblwrap"><table class="tbl" id="tbl">
      <thead><tr>
        <th data-k="name">Sheet</th><th data-k="device">Device</th><th data-k="size">Size</th>
        <th data-k="battery_volts">Battery</th><th data-k="temperature_c">Temp</th><th data-k="seen">Last heard</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table><div id="empty" class="devmeta" hidden>No sheets yet — they appear here as soon as a Dock in your fleet knows some.</div></div>
  </main>
</div>
<div class="toast" id="toast" role="status"><span class="ic"></span><span class="tx"></span></div>
<script src="/app.js"></script>
<script>
let ROWS = [], sortK = "name", sortDir = 1;
function gauge(v) {
  if (v == null) return `<span class="mono">—</span>`;
  const pct = Math.max(0, Math.min(100, ((v - 2.4) / (3.0 - 2.4)) * 100));
  return `<span class="bat ${v * 1000 < 2700 ? "low" : ""}" title="${v.toFixed(2)} V"><i><b style="width:${pct}%"></b></i></span>`;
}
function render() {
  const rows = [...ROWS].sort((a, b) => {
    const x = a[sortK], y = b[sortK];
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * sortDir;
  });
  el("count").textContent = ROWS.length ? `${ROWS.length} sheet${ROWS.length === 1 ? "" : "s"}` : "";
  el("empty").hidden = !!ROWS.length;
  el("rows").innerHTML = rows.map(s => `<tr class="${s.online === false ? "dim" : ""}">
    <td><b>${esc(s.name || s.id)}</b></td>
    <td>${esc(s.device)}${s.device_online ? "" : ` <span class="mono">(offline)</span>`}</td>
    <td class="mono">${esc(s.size || "")}</td>
    <td>${gauge(s.battery_volts)}</td>
    <td class="mono">${(s.temperature_c ?? null) !== null ? s.temperature_c + " °C" : "—"}</td>
    <td class="mono">${s.online ? `<span class="live-dot"></span>in range` : s.seen ? "seen " + ago(s.seen) : "—"}</td>
  </tr>`).join("");
  document.querySelectorAll("th").forEach(th => th.classList.toggle("sorted", th.dataset.k === sortK));
}
document.querySelector("thead").addEventListener("click", e => {
  const th = e.target.closest("th"); if (!th) return;
  if (sortK === th.dataset.k) sortDir *= -1; else { sortK = th.dataset.k; sortDir = 1; }
  render();
});
async function load() { ROWS = (await api("/api/sheets")).sheets; render(); }
load().catch(x => { if (x.message !== "signed out") toast(x.message, "err"); });
setInterval(() => load().catch(() => {}), 10000);
</script>
</body>
</html>
