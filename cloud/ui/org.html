<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><meta name="theme-color" content="#0C100F">
<meta name="robots" content="noindex">
<title>RePaper Cloud · Organisation</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600;62..125,700;62..125,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/app.css">
</head>
<body data-page="org">
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="pagehead"><h1 id="pageTitle">Organisation</h1></div>

    <div class="card stack" id="orgCard" style="margin-bottom:var(--s-3)">
      <div class="notice info" id="personalNote" hidden></div>
      <form class="row" style="align-items:flex-end" onsubmit="return saveOrg(event)">
        <div class="field" style="flex:1;min-width:220px"><label for="oname">Name</label><input id="oname" maxlength="63" required autocomplete="off" oninput="orgDirty()"></div>
        <button class="btn primary" id="orgBtn" type="submit" disabled>Save</button>
      </form>
      <div class="facts" id="orgFacts"></div>
    </div>

    <h2>Company details</h2>
    <div class="card">
      <form class="stack" id="companyForm" oninput="compDirty()" onsubmit="return saveCompany(event)">
        <div class="grid2">
          <div class="field"><label for="c_company_name">Company (legal name)</label><input id="c_company_name" maxlength="120" autocomplete="organization"></div>
          <div class="field"><label for="c_vat_id">VAT ID</label><input id="c_vat_id" maxlength="20" placeholder="DE…" autocomplete="off" style="text-transform:uppercase"></div>
          <div class="field"><label for="c_contact_name">Contact person</label><input id="c_contact_name" maxlength="120" autocomplete="name"></div>
          <div class="field"><label for="c_billing_email">Billing email</label><input id="c_billing_email" type="email" maxlength="120" autocomplete="email"></div>
          <div class="field"><label for="c_phone">Phone</label><input id="c_phone" type="tel" maxlength="30" autocomplete="tel"></div>
          <div class="field"><label for="c_address">Address</label><input id="c_address" maxlength="120" autocomplete="street-address"></div>
          <div class="field"><label for="c_zip">ZIP</label><input id="c_zip" maxlength="12" autocomplete="postal-code"></div>
          <div class="field"><label for="c_city">City</label><input id="c_city" maxlength="80" autocomplete="address-level2"></div>
          <div class="field"><label for="c_country">Country</label><input id="c_country" maxlength="60" autocomplete="country-name"></div>
        </div>
        <div class="row between"><span class="hint" style="color:var(--text-3);font-size:.8125rem">Goes on your invoices once billing is live. Optional until then.</span><button class="btn primary" id="compBtn" type="submit" disabled>Save</button></div>
      </form>
    </div>

    <h2 class="rowh">Members <button class="btn primary small" id="inviteBtn" onclick="openInvite()" hidden></button></h2>
    <div class="card" id="team"></div>

    <div id="adminSections" hidden>
      <h2>API keys <span class="mono" style="font-weight:400;text-transform:none;letter-spacing:0">— read-only fleet access for your own tools</span></h2>
      <div class="card" id="keysCard"></div>

      <h2>Branding</h2>
      <div class="card">
        <div class="twofa"><span class="okic off" id="orgIcon"></span><div style="flex:1"><b>Your logo on this console</b><span>Show your organisation's mark to your team. Coming with the first customer orgs.</span></div><button class="btn outline small" disabled>Upload logo</button></div>
      </div>
    </div>
  </main>
</div>

<dialog class="modal" id="edDlg">
  <div class="modal-head"><b id="edTitle"></b><button class="iconbtn" type="button" onclick="closeModal()" aria-label="Close">✕</button></div>
  <div class="modal-body" id="edBody"></div>
</dialog>
<div class="toast" id="toast" role="status"><span class="ic"></span><span class="tx"></span></div>

<script src="/app.js"></script>
<script>
let T = null, ORG = null;

/* ── organisation card ── */
async function loadOrg() {
  try { ORG = await api("/api/org"); renderOrg(); renderCompany(); } catch {}
}
function renderOrg() {
  if (!ORG || !ME) return;
  const admin = ME.role === "admin";
  el("oname").value = ORG.name; el("oname").disabled = !admin; orgDirty();
  el("personalNote").hidden = !ORG.personal;
  if (ORG.personal) el("personalNote").innerHTML = `${ICON.info}<div><b>This is your personal space.</b><span>Give it a name and invite people below — the moment someone joins, it works like an organisation: shared fleet, roles, the lot.</span></div>`;
  el("orgFacts").innerHTML = fact("Members", String(ORG.members)) + fact("Devices", String(ORG.devices)) + fact("Created", new Date(ORG.created * 1000).toLocaleDateString());
}
function orgDirty() { const b = el("orgBtn"); if (!ORG) return; if (!b.classList.contains("busy") && !b.classList.contains("ok")) b.disabled = el("oname").value.trim() === ORG.name || el("oname").disabled; }

/* company details */
const CFIELDS = ["company_name", "vat_id", "contact_name", "billing_email", "phone", "address", "zip", "city", "country"];
function renderCompany() {
  if (!ORG || !ME) return;
  const admin = ME.role === "admin";
  for (const fld of CFIELDS) { const i = el("c_" + fld); i.value = (ORG.company || {})[fld] || ""; i.disabled = !admin; }
  compDirty();
}
function compDirty() {
  if (!ORG) return;
  const dirty = CFIELDS.some(fld => el("c_" + fld).value.trim() !== ((ORG.company || {})[fld] || ""));
  const b = el("compBtn");
  if (!b.classList.contains("busy") && !b.classList.contains("ok")) b.disabled = !dirty || ME?.role !== "admin";
}
async function saveCompany(e) {
  e.preventDefault(); const done = busy(el("compBtn"), "Saving…");
  const company = {};
  for (const fld of CFIELDS) company[fld] = el("c_" + fld).value.trim();
  try { await api("/api/org", {company}); ORG.company = {...company}; done("Saved"); toast("Company details saved."); }
  catch (x) { done("Not saved", true); toast(x.message, "err"); }
  return false;
}
async function saveOrg(e) {
  e.preventDefault(); const done = busy(el("orgBtn"), "Saving…");
  try { await api("/api/org", {name: el("oname").value.trim()}); ORG.name = el("oname").value.trim(); done("Saved"); toast("Renamed."); renderShell(); if (ME) ME.org = ORG.name; }
  catch (x) { done("Not saved", true); toast(x.message, "err"); }
  return false;
}

/* ── API keys ── */
async function loadKeys() {
  try {
    const { keys } = await api("/api/keys");
    el("keysCard").innerHTML = keys.map(k => `<div class="member"><span class="who2"><b>${esc(k.name)}</b><span class="mono">created ${new Date(k.created * 1000).toLocaleDateString()} · ${k.last_used ? "last used " + ago(k.last_used) : "never used"}</span></span><button class="iconbtn danger" data-kid="${k.id}" title="Revoke">${ICON.trash}</button></div>`).join("")
      + `<div class="row between" style="margin-top:${keys.length ? 14 : 0}px"><span class="hint" style="color:var(--text-3);font-size:.8125rem">Send <span class="mono">Authorization: Bearer rpk_…</span> to read <span class="mono">/api/fleet</span> and friends.</span><button class="btn outline small" onclick="openNewKey()">${ICON.plus}New key</button></div>`;
  } catch {}
}
el("keysCard").addEventListener("click", async e => {
  const b = e.target.closest("[data-kid]"); if (!b) return;
  try { await api(`/api/keys/${b.dataset.kid}/revoke`, {}); toast("Key revoked — whatever used it is locked out."); loadKeys(); }
  catch (x) { toast(x.message, "err"); }
});
function openNewKey() {
  setModal("New API key", `<form class="ed" data-ed="newkey">
    <p>Read-only access to your fleet for scripts and integrations. The key is shown once.</p>
    <label for="edKn">What will use it?</label><input id="edKn" name="name" maxlength="40" required placeholder="e.g. Grafana dashboard" autocomplete="off">
    <div class="row end"><button class="btn outline" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Create key</button></div></form>`);
}
async function loadTeam() { try { T = await api("/api/team"); renderTeam(); } catch {} }
function renderTeam() {
  if (!T || !ME) return;
  const admin = ME.role === "admin";
  const btn = el("inviteBtn"); btn.hidden = !admin; btn.innerHTML = ICON.plus + "<span>Invite someone</span>";
  const rows = T.users.map(u => {
    const pill = admin && !u.you
      ? `<button class="pill ${u.role === "admin" ? "" : "setup"} pillbtn" data-act="role" data-uid="${u.id}" data-name="${esc(u.name || u.email)}" data-role="${esc(u.role)}" title="Change role">${esc(u.role)}</button>`
      : `<span class="pill ${u.role === "admin" ? "" : "setup"}">${esc(u.role)}</span>`;
    return `<div class="member"><span class="mrow">${avatarHtml(u, 36)}<span class="who2"><b>${esc(u.name || u.email)}${u.you ? " (you)" : ""}</b><span class="mono">${esc(u.email)}</span></span></span><span class="row" style="gap:8px">${pill}${admin && !u.you ? `<button class="iconbtn danger" data-uid="${u.id}" data-name="${esc(u.name || u.email)}" data-act="kick" title="Remove">${ICON.trash}</button>` : ""}</span></div>`;
  }).join("");
  const inv = (T.invites || []).map(i => `<div class="member"><span class="mrow"><span class="av" style="width:36px;height:36px;background:var(--surface-2);color:var(--text-3);font-size:14px">✉</span><span class="who2"><b>${esc(i.email)}</b><span class="mono">invited by ${esc(i.invited_by_email)} · expires ${new Date(i.expires * 1000).toLocaleDateString()}</span></span></span><span class="row" style="gap:8px"><span class="pill amber">invited</span><button class="iconbtn danger" data-iid="${i.id}" data-act="revoke" title="Revoke invitation">${ICON.x}</button></span></div>`).join("");
  el("team").innerHTML = rows + inv
    + (admin ? "" : `<div class="hint" style="margin-top:10px;color:var(--text-3);font-size:.8125rem">Admins can invite and remove people.</div>`);
}
async function copyInv(link) { try { await navigator.clipboard.writeText(link); toast("Link copied."); } catch { toast("Copy failed — select it by hand.", "err"); } }
el("team").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "kick") return openKick(b.dataset.uid, b.dataset.name);
  if (b.dataset.act === "role") {
    const next = b.dataset.role === "admin" ? "member" : "admin";
    return setModal("Change role", `<form class="ed" data-ed="role" data-uid="${esc(b.dataset.uid)}" data-role="${next}">
      <p>Make <b>${esc(b.dataset.name)}</b> ${next === "admin" ? "an <b>admin</b>? They can invite and remove people and manage API keys." : "a <b>member</b>? They keep seeing and operating the fleet, but stop managing the team."}</p>
      <div class="row end"><button class="btn outline" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Make ${next}</button></div></form>`);
  }
  if (b.dataset.act === "revoke") {
    try { await api(`/api/invites/${b.dataset.iid}/revoke`, {}); toast("Invitation revoked."); loadTeam(); }
    catch (x) { toast(x.message, "err"); }
  }
});
function openKick(uid, name) {
  setModal("Remove from team", `<form class="ed" data-ed="kick" data-uid="${esc(uid)}"><p>Remove <b>${esc(name)}</b> from this organisation? Their account is deleted; devices stay in the fleet. You can invite them again any time.</p><div class="row end"><button class="btn outline" type="button" data-act="close">Keep</button><button class="btn danger" type="submit">${ICON.trash}Remove</button></div></form>`);
}
function openInvite() {
  setModal("Invite someone", `<form class="ed" data-ed="invite">
    <p>They get a one-time link (valid 14 days) and pick their own password. No invitation, no account — that's the whole door.</p>
    <label for="edMail">Email</label><input id="edMail" name="email" type="email" required autocomplete="off" placeholder="name@company.com">
    <label class="checkline"><input type="checkbox" name="admin"> Can manage the team (admin)</label>
    <div class="row end"><button class="btn outline" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Invite</button></div></form>`);
}
el("edDlg").addEventListener("click", e => { const b = e.target.closest("[data-act=close]"); if (b) closeModal(); });
el("edDlg").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, kind = f.dataset.ed, sb = f.querySelector("button[type=submit]");
  const done = busy(sb, {invite: "Inviting…", kick: "Removing…", role: "Changing…", newkey: "Creating…"}[kind] || "Working…");
  try {
    if (kind === "newkey") {
      const r = await api("/api/keys", {name: f.elements.name.value.trim()});
      loadKeys();
      el("edTitle").textContent = "Copy your key";
      el("edBody").innerHTML = `<div class="ed"><p><b>This is shown exactly once.</b> Store it where the integration lives — we only keep a fingerprint.</p>
        <div class="linkbox mono">${esc(r.token)}</div>
        <div class="row end"><button class="btn outline" type="button" onclick="navigator.clipboard.writeText('${esc(r.token)}').then(()=>toast('Copied.'))">Copy</button><button class="btn primary" type="button" data-act="close">Done</button></div></div>`;
      return;
    }
    if (kind === "invite") {
      const email = f.elements.email.value.trim();
      const r = await api("/api/invites", {email, role: f.elements.admin.checked ? "admin" : "member"});
      loadTeam(); loadOrg();
      el("edBody").innerHTML = `<div class="ed"><p><b>Invitation created for ${esc(email)}.</b> ${r.mailed ? "An email with the link is on its way." : "Mail sending is off for now — pass them the link yourself:"}</p>
        <div class="linkbox mono">${esc(r.link)}</div>
        <div class="row end"><button class="btn outline" type="button" onclick="copyInv('${esc(r.link)}')">Copy link</button><button class="btn primary" type="button" data-act="close">Done</button></div></div>`;
      return;
    }
    if (kind === "kick") { await api(`/api/team/${f.dataset.uid}/remove`, {}); el("edDlg").close(); toast("Removed from the team."); loadTeam(); return; }
    if (kind === "role") { await api(`/api/team/${f.dataset.uid}/role`, {role: f.dataset.role}); el("edDlg").close(); toast("Role changed."); loadTeam(); return; }
  } catch (x) { done("Failed", true); const i = f.querySelector("input"); if (i) shake(i); toast(x.message, "err"); }
});
function onMe() {
  renderTeam(); renderOrg(); renderCompany();
  if (ME && ME.role === "admin") { el("adminSections").hidden = false; el("orgIcon").innerHTML = ICON.people; loadKeys(); }
}
document.addEventListener("me-ready", onMe);
if (ME) onMe();
loadTeam(); loadOrg();
</script>
</body>
</html>
