<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><meta name="theme-color" content="#0C100F">
<meta name="robots" content="noindex">
<title>RePaper Cloud · Organisation</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600;62..125,700;62..125,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/app.css">
</head>
<body data-page="org">
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="pagehead">
      <div class="orghead"><span id="orgLogo"></span><div><h1 id="orgTitle">Organisation</h1><span class="mono" id="orgMeta"></span></div></div>
      <span class="row" style="gap:8px">
        <button class="btn outline small" id="detailsBtn" onclick="openDetails()" hidden></button>
        <button class="btn primary small" id="inviteBtn" onclick="openInvite()" hidden></button>
      </span>
    </div>

    <div class="notice info" id="personalNote" hidden></div>

    <div class="card">
      <div class="searchrow" id="searchRow" hidden><span class="searchic" id="searchIc"></span><input id="search" placeholder="Search members…" autocomplete="off" oninput="renderTeam()"></div>
      <div id="team"></div>
    </div>

  </main>
</div>

<dialog class="modal" id="edDlg">
  <div class="modal-head"><b id="edTitle"></b><button class="iconbtn" type="button" onclick="closeModal()" aria-label="Close">✕</button></div>
  <div class="modal-body" id="edBody"></div>
</dialog>
<div class="toast" id="toast" role="status"><span class="ic"></span><span class="tx"></span></div>

<script src="/app.js"></script>
<script>
let T = null, ORG = null;
const CFIELDS = ["company_name", "vat_id", "contact_name", "billing_email", "address", "zip", "city", "country"];
const DIAL = [["🇩🇪","+49","Germany"],["🇦🇹","+43","Austria"],["🇨🇭","+41","Switzerland"],["🇳🇱","+31","Netherlands"],["🇧🇪","+32","Belgium"],["🇫🇷","+33","France"],["🇬🇧","+44","United Kingdom"],["🇮🇪","+353","Ireland"],["🇩🇰","+45","Denmark"],["🇸🇪","+46","Sweden"],["🇳🇴","+47","Norway"],["🇫🇮","+358","Finland"],["🇵🇱","+48","Poland"],["🇨🇿","+420","Czechia"],["🇮🇹","+39","Italy"],["🇪🇸","+34","Spain"],["🇵🇹","+351","Portugal"],["🇱🇺","+352","Luxembourg"],["🇺🇸","+1","USA / Canada"],["🇦🇺","+61","Australia"],["🇯🇵","+81","Japan"],["🌐","+","Other"]];

/* ── header ── */
async function loadOrg() { try { ORG = await api("/api/org"); renderHead(); } catch {} }
function renderHead() {
  if (!ORG) return;
  el("orgTitle").textContent = ORG.name;
  el("orgLogo").innerHTML = ORG.logo ? `<img class="orglogo" src="${esc(ORG.logo)}" alt="">` : "";
  el("orgMeta").textContent = `${ORG.members} member${ORG.members === 1 ? "" : "s"} · ${ORG.devices} device${ORG.devices === 1 ? "" : "s"} · since ${new Date(ORG.created * 1000).toLocaleDateString()}`;
  el("personalNote").hidden = !ORG.personal;
  if (ORG.personal) el("personalNote").innerHTML = `${ICON.info}<div><b>This is your personal space.</b><span>Invite people below and it works like an organisation — shared fleet, roles, the lot. Name and details live behind “Details”.</span></div>`;
}

/* ── members ── */
async function loadTeam() { try { T = await api("/api/team"); renderTeam(); } catch {} }
function renderTeam() {
  if (!T || !ME) return;
  const admin = ME.role === "admin";
  el("inviteBtn").hidden = !admin; el("inviteBtn").innerHTML = ICON.plus + "<span>Invite</span>";
  el("detailsBtn").hidden = !admin; el("detailsBtn").innerHTML = ICON.gear + "<span>Details</span>";
  el("searchRow").hidden = T.users.length + (T.invites || []).length < 6;
  el("searchIc").innerHTML = ICON.search;
  const q = (el("search").value || "").trim().toLowerCase();
  const match = (s) => !q || (s || "").toLowerCase().includes(q);
  const users = T.users.filter(u => match(u.name) || match(u.email));
  const invites = (T.invites || []).filter(i => match(i.email));
  const roleCtl = (u) => admin && !u.you
    ? `<span class="selwrap"><select class="rolesel" data-uid="${u.id}" title="Change role"><option value="member" ${u.role === "member" ? "selected" : ""}>Member</option><option value="admin" ${u.role === "admin" ? "selected" : ""}>Admin</option></select></span>`
    : `<span class="rolestat">${u.role === "admin" ? "Admin" : "Member"}</span>`;
  const rows = users.map(u => `<div class="member"><span class="mrow">${avatarHtml(u, 36)}<span class="who2"><b>${esc(u.name || u.email)}${u.you ? ` <span class="youtag">you</span>` : ""}</b><span class="mono">${esc(u.email)}</span></span></span><span class="row" style="gap:6px;flex-wrap:nowrap">${roleCtl(u)}${admin && !u.you ? `<button class="iconbtn danger" data-uid="${u.id}" data-name="${esc(u.name || u.email)}" data-act="kick" title="Remove">${ICON.trash}</button>` : ""}</span></div>`).join("");
  const inv = invites.map(i => `<div class="member dim"><span class="mrow"><span class="av" style="width:36px;height:36px;background:var(--surface-2);color:var(--text-3);font-size:14px">✉</span><span class="who2"><b>${esc(i.email)}</b><span class="mono">invited by ${esc(i.invited_by_email)} · expires ${new Date(i.expires * 1000).toLocaleDateString()}</span></span></span><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="rolestat">Invited</span><button class="iconbtn danger" data-iid="${i.id}" data-act="revoke" title="Revoke invitation">${ICON.x}</button></span></div>`).join("");
  el("team").innerHTML = (rows + inv) || `<div class="devmeta" style="padding:8px 0">${q ? "Nobody matches your search." : "Just you so far."}</div>`;
}
el("team").addEventListener("change", async e => {
  const s = e.target.closest(".rolesel"); if (!s) return;
  const prev = s.value === "admin" ? "member" : "admin";
  try { await api(`/api/team/${s.dataset.uid}/role`, {role: s.value}); toast(`Role changed to ${s.value}.`); loadTeam(); }
  catch (x) { s.value = prev; toast(x.message, "err"); }
});
el("team").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "kick") {
    return setModal("Remove from team", `<form class="ed" data-ed="kick" data-uid="${esc(b.dataset.uid)}"><p>Remove <b>${esc(b.dataset.name)}</b> from this organisation? Their account is deleted; devices stay in the fleet. You can invite them again any time.</p><div class="row end"><button class="btn outline" type="button" data-act="close">Keep</button><button class="btn danger" type="submit">${ICON.trash}Remove</button></div></form>`);
  }
  if (b.dataset.act === "revoke") {
    try { await api(`/api/invites/${b.dataset.iid}/revoke`, {}); toast("Invitation revoked."); loadTeam(); loadOrg(); }
    catch (x) { toast(x.message, "err"); }
  }
});
function openInvite() {
  setModal("Invite someone", `<form class="ed" data-ed="invite">
    <p>They get a one-time link (valid 14 days) and pick their own password. No invitation, no account — that's the whole door.</p>
    <label for="edMail">Email</label><input id="edMail" name="invitee" type="email" required autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore placeholder="name@company.com">
    <label class="checkline"><input type="checkbox" name="admin"> Can manage the organisation (admin)</label>
    <div class="row end"><button class="btn outline" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Invite</button></div></form>`);
}

/* ── details modal: identity + company ── */
function splitPhone(full) {
  const f = (full || "").trim();
  for (const [, code] of DIAL) if (code !== "+" && f.startsWith(code)) return [code, f.slice(code.length).trim()];
  return [f.startsWith("+") ? "+" : "+49", f.replace(/^\+/, "")];
}
function openDetails() {
  const c = ORG.company || {}, [dial, rest] = splitPhone(c.phone);
  setModal("Organisation details", `<form class="ed" data-ed="details">
    <div class="detid"><button class="avbtn" type="button" id="logoBtn" title="Change logo">${ORG.logo ? `<img class="av" src="${esc(ORG.logo)}" style="width:56px;height:56px;border-radius:12px">` : `<span class="av" style="width:56px;height:56px;border-radius:12px;background:var(--surface-2);color:var(--text-3)">${ICON.camera}</span>`}<span class="avhint" style="border-radius:12px">${ICON.camera}</span></button>
      <div class="field" style="flex:1"><label for="d_name">Display name</label><input id="d_name" value="${esc(ORG.name)}" maxlength="63" required autocomplete="off"><div class="hint">What your team sees. The legal name below goes on invoices.</div></div></div>
    <input type="file" id="logoFile" accept="image/png,image/jpeg" hidden>
    <div class="grid2">
      <div class="field"><label for="d_company_name">Company (legal name)</label><input id="d_company_name" value="${esc(c.company_name || "")}" maxlength="120"></div>
      <div class="field"><label for="d_vat_id">VAT ID</label><input id="d_vat_id" value="${esc(c.vat_id || "")}" maxlength="20" placeholder="DE…" style="text-transform:uppercase"></div>
      <div class="field"><label for="d_contact_name">Contact person</label><input id="d_contact_name" value="${esc(c.contact_name || "")}" maxlength="120"></div>
      <div class="field"><label for="d_billing_email">Billing email</label><input id="d_billing_email" type="email" value="${esc(c.billing_email || "")}" maxlength="120"></div>
      <div class="field" style="grid-column:1/-1"><label for="d_phone">Phone</label><div class="phonerow"><span class="selwrap"><select id="d_dial">${DIAL.map(([fl, code, name]) => `<option value="${code}" ${code === dial ? "selected" : ""}>${fl} ${code}</option>`).join("")}</select></span><input id="d_phone" inputmode="tel" value="${esc(rest)}" maxlength="20" placeholder="151 2345678" style="flex:1"></div></div>
      <div class="field" style="grid-column:1/-1"><label for="d_address">Address</label><input id="d_address" value="${esc(c.address || "")}" maxlength="120"></div>
      <div class="field"><label for="d_zip">ZIP</label><input id="d_zip" value="${esc(c.zip || "")}" maxlength="12"></div>
      <div class="field"><label for="d_city">City</label><input id="d_city" value="${esc(c.city || "")}" maxlength="80"></div>
      <div class="field"><label for="d_country">Country</label><input id="d_country" value="${esc(c.country || "")}" maxlength="60"></div>
    </div>
    <div class="row between"><span class="hint" style="color:var(--text-3);font-size:.8125rem">Company details go on your invoices once billing is live.</span>
      <span class="row"><button class="btn outline" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Save</button></span></div>
  </form>`);
  el("logoBtn").addEventListener("click", () => el("logoFile").click());
  el("logoFile").addEventListener("change", () => {
    const file = el("logoFile").files[0]; if (!file) return;
    const img = new Image();
    img.onload = async () => {
      const c2 = document.createElement("canvas"); c2.width = c2.height = 128;
      const s = Math.min(img.width, img.height);
      c2.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
      const data = c2.toDataURL("image/png");
      try { await api("/api/org", {logo: data}); ORG.logo = data; renderHead(); toast("Logo updated."); el("logoBtn").querySelector(".av").outerHTML = `<img class="av" src="${data}" style="width:56px;height:56px;border-radius:12px">`; }
      catch (x) { toast(x.message, "err"); }
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
    el("logoFile").value = "";
  });
}

/* ── shared modal submit ── */
el("edDlg").addEventListener("click", e => { const b = e.target.closest("[data-act=close]"); if (b) closeModal(); });
el("edDlg").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, kind = f.dataset.ed, sb = f.querySelector("button[type=submit]");
  const done = busy(sb, {invite: "Inviting…", kick: "Removing…", details: "Saving…"}[kind] || "Working…");
  try {
    if (kind === "details") {
      const company = {};
      for (const fld of CFIELDS) company[fld] = el("d_" + fld).value.trim();
      const num = el("d_phone").value.trim();
      company.phone = num ? (el("d_dial").value === "+" ? num : `${el("d_dial").value} ${num}`) : "";
      await api("/api/org", {name: el("d_name").value.trim(), company});
      ORG.name = el("d_name").value.trim(); ORG.company = {...company};
      done("Saved"); toast("Saved."); renderHead(); renderShell(); await wait(400); closeModal();
      return;
    }
    if (kind === "invite") {
      const email = f.elements.invitee.value.trim();
      const r = await api("/api/invites", {email, role: f.elements.admin.checked ? "admin" : "member"});
      loadTeam(); loadOrg();
      el("edTitle").textContent = "Invitation sent";
      el("edBody").innerHTML = `<div class="ed">
        <div class="twofa" style="align-items:flex-start"><span class="okic">${r.mailed ? ICON.mail : ICON.warn}</span>
          <div style="flex:1"><b>${r.mailed ? "Email on its way" : "Mail is off right now"}</b>
          <span>${r.mailed ? `<b>${esc(email)}</b> just got an invitation from RePaper Cloud — the link inside is valid for 14 days. The backup copy below is the same link.` : `Send <b>${esc(email)}</b> the link below yourself — it's valid for 14 days.`}</span></div></div>
        <div class="linkbox mono">${esc(r.link)}</div>
        <div class="row end">${copyBtnHtml("invCopy")}<button class="btn primary" type="button" data-act="close">Done</button></div></div>`;
      wireCopyBtn("invCopy", r.link);
      return;
    }
    if (kind === "kick") { await api(`/api/team/${f.dataset.uid}/remove`, {}); el("edDlg").close(); toast("Removed from the team."); loadTeam(); loadOrg(); return; }
  } catch (x) { done("Failed", true); const i = f.querySelector("input"); if (i) shake(i); toast(x.message, "err"); }
});
async function copyInv(link) { try { await navigator.clipboard.writeText(link); toast("Link copied."); } catch { toast("Copy failed — select it by hand.", "err"); } }

function onMe() { renderTeam(); renderHead(); }
document.addEventListener("me-ready", onMe);
if (ME) onMe();
loadTeam(); loadOrg();
</script>
</body>
</html>
