<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><meta name="theme-color" content="#0C100F">
<meta name="robots" content="noindex">
<title>RePaper Cloud · Fleet</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600;62..125,700;62..125,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/app.css">
</head>
<body data-page="fleet">
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="pagehead"><h1>Fleet</h1><div class="filters" id="filters"></div></div>
    <div id="alerts"></div>
    <div class="fleet" id="fleet"></div>
  </main>
</div>

<dialog class="modal" id="edDlg">
  <div class="modal-head"><b id="edTitle"></b><button class="iconbtn" type="button" onclick="closeModal()" aria-label="Close">✕</button></div>
  <div class="modal-body" id="edBody"></div>
</dialog>
<dialog class="modal" id="detDlg">
  <div class="modal-head"><b id="detName"></b><button class="iconbtn" type="button" onclick="el('detDlg').close()" aria-label="Close">✕</button></div>
  <div class="modal-body" id="detBody"></div>
</dialog>
<div class="toast" id="toast" role="status"><span class="ic"></span><span class="tx"></span></div>

<script src="/app.js"></script>
<script>
let S = { devices: [] };
let FILTER = (() => { try { return localStorage.getItem("fleetFilter") || "all"; } catch { return "all"; } })();
const FILTERS = [
  ["all", "All", () => true],
  ["online", "Online", d => d.online],
  ["offline", "Offline", d => !d.online],
  ["pending", "Needs approval", d => d.approved === false],
];
function renderFilters() {
  const counts = Object.fromEntries(FILTERS.map(([k, , fn]) => [k, S.devices.filter(fn).length]));
  if (FILTER !== "all" && !counts[FILTER]) FILTER = "all";
  setHTML("filters", FILTERS
    .filter(([k]) => k === "all" || counts[k] > 0)
    .map(([k, label]) => `<button class="fchip ${FILTER === k ? "on" : ""}" data-f="${k}">${label}<span>${counts[k]}</span></button>`).join(""));
}
document.addEventListener("click", e => {
  const b = e.target.closest(".fchip"); if (!b) return;
  FILTER = b.dataset.f;
  try { localStorage.setItem("fleetFilter", FILTER); } catch {}
  renderFilters(); render();
});
el("fleet").innerHTML = skeletons("cards", 2);

function card(d, showSite = true) {
  const st = d.status || {}, sheets = st.sheets || [], off = !d.online;
  const light = d.kind === "dock-light";
  const name = d.name || st.printer || (light ? "Dock Light" : d.kind === "dock" ? "Dock" : "Go");
  // no echoes: the printer name only when it differs from the card title,
  // the site only when the list isn't already grouped by site
  const sub = [st.printer && st.printer !== name ? st.printer : "", showSite && d.site ? d.site : ""]
    .filter(Boolean).join(" · ");
  const low = sheets.filter(x => x.battery_volts != null && x.battery_volts * 1000 < 2700).length;
  const away = sheets.filter(x => x.online === false).length;
  const chips = [
    light ? `<span class="dchip mono">Dock Light</span>` : "",
    d.version ? `<span class="dchip mono">v${esc(d.version)}</span>` : "",
    light ? (d.mirror ? `<span class="dchip mono">→ ${esc(d.mirror)}</span>` : `<span class="dchip mono warn">no mirror yet</span>`)
          : `<span class="dchip mono">${sheets.length ? `${sheets.length} sheet${sheets.length === 1 ? "" : "s"}` : "no sheets"}</span>`,
    st.jobs_today ? `<span class="dchip mono">${st.jobs_today} job${st.jobs_today === 1 ? "" : "s"} today</span>` : "",
    low ? `<span class="dchip mono warn">${low} low battery</span>` : "",
    away && !low ? `<span class="dchip mono dim">${away} out of range</span>` : "",
  ].filter(Boolean).join("");
  return `<div class="dev ${off ? "off" : ""}" data-id="${esc(d.id)}">
    <div class="dev-top">
      <span class="devic ${off ? "off" : ""}">${d.kind === "go" ? ICON.phone : ICON.dock}</span>
      <span class="devwho"><b>${esc(name)}</b>${sub ? `<span class="mono">${esc(sub)}</span>` : ""}</span>
    </div>
    ${d.approved === false ? `<div class="notice" style="margin:8px 0 0"><b style="color:var(--amber)">Waiting for approval</b><span>A member added this device.${ME?.role === "admin" ? "" : " An admin activates it."}</span>${ME?.role === "admin" ? `<button class="btn primary small" data-act="approve" style="margin-left:auto">Approve</button>` : ""}</div>` : ""}
    <div class="dchips">${chips}</div>
    <div class="dev-foot">
      <span class="presence ${off ? "off" : ""}"><span class="dot"></span><b>${off ? "seen " + ago(d.last_seen) : "online"}</b></span>
      <span class="iconrow"><button class="iconbtn" data-act="identify" title="Identify" aria-label="Identify" ${off ? "disabled" : ""}>${ICON.ping}</button><button class="iconbtn" data-act="name" title="Rename" aria-label="Rename">${ICON.pencil}</button><button class="iconbtn" data-act="details" title="Details" aria-label="Details">${ICON.info}</button><button class="iconbtn danger" data-act="remove" title="Remove" aria-label="Remove">${ICON.trash}</button></span>
    </div></div>`;
}

function render() {
  const fn = (FILTERS.find(([k]) => k === FILTER) || FILTERS[0])[2];
  const shown = S.devices.filter(fn);
  const bySite = new Map();
  for (const d of shown) { const k = d.site || ""; if (!bySite.has(k)) bySite.set(k, []); bySite.get(k).push(d); }
  let html = "";
  if (bySite.size > 1) {
    for (const [site, devs] of [...bySite.entries()].sort((a, b) => (a[0] || "~").localeCompare(b[0] || "~")))
      html += `<div class="sitehead">${esc(site || "No site")}</div>` + devs.map(d => card(d, false)).join("");
  } else html = shown.map(d => card(d)).join("");
  setHTML("fleet", html
    + (FILTER !== "all" && !shown.length ? `<div class="empty-hint" style="grid-column:1/-1">Nothing here — switch the filter above.</div>` : "")
    + (FILTER === "all" ? `<button class="addcard" type="button" onclick="openModal('claim')"><span class="plus">${ICON.plus}</span><span>${S.devices.length ? "Claim a device" : "Claim your first device"}</span></button>` : "")
    + (S.devices.length ? "" : `<div class="empty-hint" style="grid-column:1/-1">A Dock shows its claim code on its settings page under <b>RePaper Cloud</b> once it is pointed at this cloud. Enter the code here and it joins your fleet.</div>`));
}

function renderAlerts(alerts) {
  setHTML("alerts", (alerts || []).map(a =>
    `<div class="notice ${a.level === "err" ? "err" : ""}">${a.level === "err" ? ICON.x : ICON.warn}<div><b>${esc(a.title)}</b><span>${esc(a.text)}</span></div></div>`).join(""));
}

async function load() {
  const [fleet, al] = await Promise.all([api("/api/fleet"), api("/api/alerts").catch(() => null)]);
  S = { ...S, ...fleet };
  renderFilters();
  if (al) renderAlerts(al.alerts);
  if (!document.querySelector("dialog[open]")) render();
}

function openDetails(id) {
  const d = S.devices.find(x => x.id === id); if (!d) return;
  const st = d.status || {}, sheets = st.sheets || [];
  el("detName").textContent = d.name || st.printer || d.kind;
  api(`/api/devices/${id}`).then(full => {
    const rows = sheets.map(s => {
      const away = s.online === false, batt = s.battery_volts ? `${s.battery_volts.toFixed(2)} V` : "";
      const temp = (s.temperature_c ?? null) !== null ? `${s.temperature_c} °C` : "";
      return `<div class="dsheet ${away ? "away" : ""}"><b>${esc(s.name || s.id)}</b><span class="mono">${esc([s.size, batt, temp].filter(Boolean).join(" · "))}${away && s.seen ? " · seen " + ago(s.seen) : ""}</span></div>`;
    }).join("");
    const evts = (full.events || []).map(e => `<div class="evt"><span class="mono">${new Date(e.at * 1000).toLocaleString()}</span><span>${esc(e.type)}${e.data ? " · " + esc(e.data) : ""}</span></div>`).join("");
    // Dock Light: choose where its jobs appear — any approved Go device in the org
    const mirrorCard = d.kind !== "dock-light" ? "" : (() => {
      const targets = S.devices.filter(x => x.kind === "go" && x.approved !== false);
      const opts = [`<option value="" ${!d.mirror_to ? "selected" : ""}>— no mirror —</option>`]
        .concat(targets.map(t => `<option value="${esc(t.id)}" ${t.id === d.mirror_to ? "selected" : ""}>${esc(t.name || (t.status || {}).printer || t.id.slice(0, 8))}${t.online ? "" : " (offline)"}</option>`))
        .join("");
      return `<div><h2 style="margin-top:0">Mirror</h2>
        <p class="devmeta" style="margin:0 0 8px">Jobs printed on this Dock Light appear on the mirrored device — whichever sheets that device carries do the printing.</p>
        ${targets.length ? `<div class="row"><select id="mirrorSel" class="fieldlike">${opts}</select>
        <button class="btn primary small" onclick="saveMirror('${esc(d.id)}', this)">Save</button></div>` : `<div class="devmeta">No RePaper Go devices in this fleet yet — the Dock Light has nothing to mirror to.</div>`}
        <div class="hint" style="color:var(--text-3);font-size:.75rem;margin-top:6px">Dock Light pages travel through RePaper Cloud to reach the mirrored device and are deleted on delivery.</div></div>`;
    })();
    el("detBody").innerHTML = `<div class="facts grid">${
      fact("Kind", d.kind === "dock-light" ? "Dock Light" : d.kind) + fact("Printer", st.printer) + fact("Software", d.version) + fact("State", st.state)
      + (d.kind === "dock-light" ? fact("Mirrors to", d.mirror || "nothing yet") : "")
      + fact("Reader", st.identifier) + fact("Jobs today", st.jobs_today != null ? String(st.jobs_today) : "")
      + (st.lan ? `<div class="fact"><i>Local page</i><b><a href="${esc(st.lan)}" target="_blank" rel="noopener" style="color:var(--accent-text)">${esc(st.lan.replace(/^http:\/\//, "").replace(/\/$/, ""))}</a></b></div>` : fact("Local page", st.web))
      + fact("Claimed", d.claimed_at ? new Date(d.claimed_at * 1000).toLocaleDateString() : "")
      + fact("Last seen", d.online ? "online now" : ago(d.last_seen)) + fact("Device id", d.id)
    }</div>${mirrorCard}${sheets.length ? `<div><h2 style="margin-top:0">Sheets</h2><div class="dsheets">${rows}</div></div>` : ""}
    ${evts ? `<div><h2 style="margin-top:0">Activity</h2><div>${evts}</div></div>` : ""}
    <div><h2 style="margin-top:0">Diagnostics</h2>${full.diag ? `<pre class="diaglog mono">${esc(full.diag.log)}</pre><div class="hint" style="color:var(--text-3);font-size:.75rem">captured ${ago(full.diag.at)}</div>` : `<div class="devmeta">No bundle yet — ask the device for its recent log.</div>`}
    <div class="row" style="margin-top:10px">${st.lan ? `<a class="btn outline small" href="${esc(st.lan)}" target="_blank" rel="noopener">Open device page</a><span class="hint" style="color:var(--text-3);font-size:.75rem;flex-basis:100%">The device page opens only from the Dock's own network.</span>` : ""}<button class="btn outline small" onclick="requestDiag('${esc(d.id)}', this)" ${d.online ? "" : "disabled"}>Request diagnostics</button><button class="btn outline small" onclick="remoteReboot('${esc(d.id)}', this)" ${d.online ? "" : "disabled"}>Restart device</button></div></div>`;
    el("detDlg").showModal();
  }).catch(x => toast(x.message, "err"));
}
async function saveMirror(id, b) {
  const done = busy(b, "Saving…");
  const to = el("mirrorSel").value || null;
  try {
    const r = await api(`/api/devices/${id}/mirror`, { to });
    done("Saved");
    toast(r.to ? `Jobs from this Dock Light now appear on ${r.to}.` : "Mirror cleared — jobs are refused until you choose one.");
    load();
  } catch (x) { done("Failed", true); toast(x.message, "err"); }
}
async function remoteReboot(id, b) {
  const done = busy(b, "Restarting…");
  try { await api(`/api/devices/${id}/reboot`, {}); done("Sent"); toast("The device restarts and reports back in about a minute."); }
  catch (x) { done("Failed", true); toast(x.message, "err"); }
}
async function requestDiag(id, b) {
  const done = busy(b, "Asking…");
  try { await api(`/api/devices/${id}/diag`, {}); done("Requested"); toast("The device is sending its log — reopen the details in a few seconds."); }
  catch (x) { done("Failed", true); toast(x.message, "err"); }
}

const modals = {
  claim: () => ["Claim a device", `<form class="ed" data-ed="claim">
    <p>On the Dock, open <b>Settings → RePaper Cloud</b> and point it at this cloud. Its claim code appears there.</p>
    <label for="edCode">Claim code</label><input id="edCode" name="value" class="serial" placeholder="3F9A-B2C1" maxlength="9" required autocomplete="off" style="font-family:var(--font-mono);text-transform:uppercase">
    <div class="row end"><button class="btn outline" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Claim</button></div></form>`],
  name: (d) => ["Edit device", `<form class="ed" data-ed="name" data-id="${esc(d.id)}">
    <label for="edName">Name</label><input id="edName" name="value" value="${esc(d.name || (d.status || {}).printer || "")}" maxlength="63" required autocomplete="off">
    <label for="edSite">Site <span style="color:var(--text-3);font-weight:400">(optional — groups the fleet)</span></label><input id="edSite" name="site" value="${esc(d.site || "")}" maxlength="40" placeholder="e.g. Office Witten" autocomplete="off">
    <div class="row end"><button class="btn outline" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>`],
  remove: (d) => ["Remove device", `<form class="ed" data-ed="remove" data-id="${esc(d.id)}"><p>Remove <b>${esc(d.name || (d.status || {}).printer || d.id)}</b> from this fleet? The device keeps working on its own and can be claimed again with a fresh code.</p><div class="row end"><button class="btn outline" type="button" data-act="close">Keep</button><button class="btn danger" type="submit">${ICON.trash}Remove</button></div></form>`],
};
function openModal(kind, id) {
  const d = S.devices.find(x => x.id === id) || {};
  const [title, html] = modals[kind](d);
  setModal(title, html);
}
el("edDlg").addEventListener("click", e => { const b = e.target.closest("[data-act=close]"); if (b) { closeModal(); render(); } });
el("edDlg").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, kind = f.dataset.ed, id = f.dataset.id, sb = f.querySelector("button[type=submit]");
  const done = busy(sb, {claim: "Claiming…", name: "Saving…", remove: "Removing…"}[kind]);
  try {
    if (kind === "claim") {
      const r = await api("/api/claim", {code: f.elements.value.value});
      done("Claimed"); await load(); toast(`${r.device.name || "Device"} joined the fleet.`); await wait(400); closeModal(); render();
      const c = el("fleet").querySelector(`[data-id="${CSS.escape(r.device.id)}"]`); if (c) c.classList.add("enter", "hi");
      return;
    }
    if (kind === "remove") { await api(`/api/devices/${id}/remove`, {}); el("edDlg").close(); const c = el("fleet").querySelector(`[data-id="${CSS.escape(id)}"]`); if (c) { c.classList.add("leave"); await wait(240); } toast("Removed."); await load(); render(); return; }
    await api(`/api/devices/${id}`, {name: f.elements.value.value.trim(), site: f.elements.site.value}); done("Saved"); await load(); toast("Saved."); await wait(400); closeModal(); render();
  } catch (x) { done(kind === "claim" ? "Not claimed" : "Failed", true); const i = f.querySelector("input"); if (i) shake(i); toast(x.message, "err"); }
});
el("fleet").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.closest(".dev").dataset.id, act = b.dataset.act;
  if (act === "details") return openDetails(id);
  if (modals[act]) return openModal(act, id);
  if (act === "approve") {
    const done = busy(b, "Approving…");
    try { await api(`/api/devices/${id}/approve`, {}); done("Approved"); toast("Device approved — it can print now."); load(); }
    catch (x) { done("Failed", true); toast(x.message, "err"); }
    return;
  }
  if (act === "identify") {
    b.disabled = true;
    try { await api(`/api/devices/${id}/identify`, {}); toast("The device says hi — watch its ring / log."); }
    catch (x) { toast(x.message, "err"); }
    b.disabled = false;
  }
});
load().catch(x => { if (x.message !== "signed out") toast(x.message, "err"); });
setInterval(() => load().catch(() => {}), 5000);
</script>
</body>
</html>
