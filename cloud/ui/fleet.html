<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><meta name="theme-color" content="#0C100F">
<meta name="robots" content="noindex">
<title>RePaper Cloud · Fleet</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600;62..125,700;62..125,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/app.css">
</head>
<body data-page="fleet">
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="pagehead"><h1>Fleet</h1>
      <div class="fleet-controls">
        <div class="fsearch"><span class="si"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></span><input id="fsearch" type="search" placeholder="Search devices…" autocomplete="off" spellcheck="false"><button type="button" class="skbd" onclick="openCmdK()" title="Search everything — ⌘K">⌘K</button></div>
        <div class="viewtoggle" id="viewtoggle"></div>
      </div>
    </div>
    <div class="filterbar" id="filters"></div>
    <div id="alerts"></div>
    <div class="fleet" id="fleet"></div>
  </main>
</div>

<dialog class="modal" id="edDlg">
  <div class="modal-head"><b id="edTitle"></b><button class="iconbtn" type="button" onclick="closeModal()" aria-label="Close">✕</button></div>
  <div class="modal-body" id="edBody"></div>
</dialog>
<dialog class="modal" id="detDlg">
  <div class="modal-head"><b id="detName"></b><button class="iconbtn" type="button" onclick="el('detDlg').close()" aria-label="Close">✕</button></div>
  <div class="modal-body" id="detBody"></div>
</dialog>
<div class="toast" id="toast" role="status"><span class="ic"></span><span class="tx"></span></div>

<script src="/app.js"></script>
<script>
let S = { devices: [] };
let FILTER = (() => { try { return localStorage.getItem("fleetFilter") || "all"; } catch { return "all"; } })();
let VIEW = (() => { try { return localStorage.getItem("fleetView") || "grid"; } catch { return "grid"; } })();
const params = new URLSearchParams(location.search);
if (params.get("filter")) { FILTER = params.get("filter"); try { localStorage.setItem("fleetFilter", FILTER); } catch {} }
if (params.get("view") === "list" || params.get("view") === "grid") { VIEW = params.get("view"); try { localStorage.setItem("fleetView", VIEW); } catch {} }
let OPEN_DEVICE = params.get("device") || null;
let OPEN_CLAIM = params.get("claim") === "1";
const FILTERS = [
  ["all", "All", () => true],
  ["online", "Online", d => d.online],
  ["printing", "Printing", d => (d.status || {}).state === "printing"],
  ["offline", "Offline", d => !d.online],
  ["pending", "Needs approval", d => d.approved === false],
];
/* the state-aware device box — the product art, live: glowing when online,
   dimmed when offline, pulsing when printing. Reuses .devbox / .devphone / .gomark. */
function deviceArt(d, box = 60) {
  const off = !d.online, printing = (d.status || {}).state === "printing";
  const cls = [off ? "off" : "", printing ? "printing" : ""].filter(Boolean).join(" ");
  if (d.kind === "go") { const pw = Math.round(box * 92 / 166); return `<span class="devphone ${cls}" style="--pw:${pw}px"><span class="gomark"><span class="go">GO</span></span></span>`; }
  if (d.kind === "dock-light") return `<span class="devbox light ${cls}" style="--box:${box}px"><span class="devring"></span><span class="golet"><span class="gomark"><span class="go">GO</span></span></span></span>`;
  return `<span class="devbox ${cls}" style="--box:${box}px"><span class="devring"></span></span>`;
}
/* the Dock's local page — surfaced right on the card so it's one click away */
function lanRow(d) {
  const st = d.status || {}; if (d.kind === "go" || !st.lan) return "";
  const off = !d.online, addr = st.lan.replace(/^https?:\/\//, "").replace(/\/$/, "");
  return `<a class="lanrow ${off ? "off" : ""}" href="${esc(st.lan)}" target="_blank" rel="noopener" title="${off ? "The Dock is offline" : "Opens the Dock's own page — reachable on its network"}"${off ? ' aria-disabled="true" tabindex="-1"' : ""}>
    <span class="lg">${ICON.globe}</span><span class="ll">Local page</span><span class="addr">${esc(addr)}</span><span class="ext">${ICON.external}</span></a>`;
}
function renderFilters() {
  const counts = Object.fromEntries(FILTERS.map(([k, , fn]) => [k, S.devices.filter(fn).length]));
  if (FILTER !== "all" && !counts[FILTER]) FILTER = "all";
  setHTML("filters", FILTERS
    .filter(([k]) => k === "all" || counts[k] > 0)
    .map(([k, label]) => `<button class="fchip ${FILTER === k ? "on" : ""}" data-f="${k}">${label}<span>${counts[k]}</span></button>`).join(""));
}
document.addEventListener("click", e => {
  const b = e.target.closest(".fchip"); if (!b) return;
  FILTER = b.dataset.f;
  try { localStorage.setItem("fleetFilter", FILTER); } catch {}
  renderFilters(); render();
});
function renderViewToggle() {
  setHTML("viewtoggle", [["grid", ICON.grid, "Cards"], ["list", ICON.list, "List"]].map(([k, ic, label]) =>
    `<button class="vbtn ${VIEW === k ? "on" : ""}" data-v="${k}" title="${label} view" aria-label="${label} view">${ic}</button>`).join(""));
}
document.addEventListener("click", e => {
  const b = e.target.closest(".vbtn"); if (!b) return;
  VIEW = b.dataset.v; try { localStorage.setItem("fleetView", VIEW); } catch {}
  renderViewToggle(); render();
});
let Q = "";
renderViewToggle();
el("fsearch").addEventListener("input", e => { Q = e.target.value.trim().toLowerCase(); render(); });
el("fleet").innerHTML = skeletons("cards", 2);

/* hand-drawn check / cross for the Print2Go tile — a little more human */
const HAND_CHECK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 12.8c1.7 1 3.3 2.7 4.5 4.8.4.7 1.3.6 1.6-.2C11.9 12.4 15 7.4 20.6 3.6"/></svg>`;
const HAND_X = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.8c3.1 2.8 7.2 7.2 11.8 12.4"/><path d="M18 6C14.7 8.9 10.4 13.2 6 18.2"/></svg>`;
/* the stats, as clear icon + value + unit tiles (equal width, uniform icons) */
function statTile(icon, value, label, tone) {
  const isTxt = typeof value === "string" && isNaN(Number(value));
  return `<div class="dstat ${tone || ""}"><span class="di">${icon}</span><b class="${isTxt ? "txt" : ""}">${isTxt ? esc(value) : value}</b><span class="dl">${label}</span></div>`;
}
function deviceStats(d) {
  const st = d.status || {}, sheets = st.sheets || [];
  const low = sheets.filter(x => x.battery_volts != null && x.battery_volts * 1000 < 2700).length;
  const jobs = st.jobs_today || 0;
  const p2gOn = !!(d.print2go || d.mirror_from);
  return [
    low ? statTile(ICON.sheet, sheets.length, `${low} low`, "warn")
        : statTile(ICON.sheet, sheets.length, sheets.length === 1 ? "sheet" : "sheets"),
    statTile(ICON.printer, jobs, "today"),
    `<div class="dstat ${p2gOn ? "ok" : "muted"}"><span class="di">${ICON.phone}</span><span class="dcheck hand">${p2gOn ? HAND_CHECK : HAND_X}</span><span class="dl">print2go</span></div>`,
  ];
}
function statusPill(d) {
  const st = d.status || {};
  if (d.approved === false) return `<span class="spill warn"><span class="d"></span>Waiting for approval</span>`;
  if (!d.online) return `<span class="spill off"><span class="d"></span>Offline · seen ${ago(d.last_seen)}</span>`;
  if (st.state === "printing") return `<span class="spill live"><span class="d"></span>Printing now</span>`;
  return `<span class="spill ok"><span class="d"></span>Online</span>`;
}
function sheetRow(s) {
  const away = s.online === false, v = s.battery_volts;
  const pct = v != null ? Math.max(5, Math.min(100, Math.round((v - 2.4) / (4.2 - 2.4) * 100))) : null;
  const lowb = v != null && v * 1000 < 2700;
  const temp = (s.temperature_c ?? null) !== null ? `${s.temperature_c} °C` : "";
  return `<div class="dsheet ${away ? "away" : ""}">
    <span class="sname"><b>${esc(s.name || s.id)}</b><span class="mono">${esc([s.size, temp].filter(Boolean).join(" · "))}${away && s.seen ? " · seen " + ago(s.seen) : ""}</span></span>
    ${pct != null ? `<span class="sbat ${lowb ? "low" : ""}"><span class="sbg"><span style="width:${pct}%"></span></span><span class="sv mono">${v.toFixed(2)}V</span></span>` : (away ? `<span class="sbat-off mono">out of range</span>` : "")}
  </div>`;
}

function card(d, showSite = true) {
  const st = d.status || {}, off = !d.online, printing = st.state === "printing";
  const light = d.kind === "dock-light";
  const name = d.name || st.printer || (light ? "Dock Light" : d.kind === "dock" ? "Dock" : "Go");
  const sub = [light ? "Dock Light" : d.kind === "go" ? "Go" : "Dock", showSite && d.site ? d.site : "", d.version ? "v" + d.version : ""]
    .filter(Boolean).join(" · ");
  const upd = d.target_version && d.target_version !== d.version;
  return `<div class="dev ${off ? "off" : ""} ${printing ? "printing" : ""}" data-id="${esc(d.id)}">
    <button class="dev-top" data-act="details" title="Open details">
      <span class="fdart">${deviceArt(d)}</span>
      <span class="devwho"><b>${esc(name)}</b>${sub ? `<span class="mono">${esc(sub)}</span>` : ""}</span>
      <span class="dev-go">${ICON.chevright}</span>
    </button>
    ${d.approved === false ? `<div class="notice" style="margin:10px 0 0"><b style="color:var(--amber)">Waiting for approval</b><span>A member added this device.${ME?.role === "admin" ? "" : " An admin activates it."}</span>${ME?.role === "admin" ? `<button class="btn primary small" data-act="approve" style="margin-left:auto">Approve</button>` : ""}</div>` : ""}
    <div class="dstats">${deviceStats(d).join("")}</div>
    ${lanRow(d)}
    <div class="dev-foot">
      <span class="presence ${off ? "off" : ""} ${printing ? "printing" : ""}"><span class="dot"></span><b>${off ? "seen " + ago(d.last_seen) : printing ? "printing" : "online"}</b></span>
      ${upd ? `<span class="upi" title="Update available: ${esc(d.target_version)}" aria-label="Update available">${ICON.download}</span>` : ""}
      <span class="iconrow"><button class="iconbtn" data-act="identify" title="Find it — blink the light ring" aria-label="Find it" ${off ? "disabled" : ""}>${ICON.ping}</button><button class="iconbtn" data-act="name" title="Rename" aria-label="Rename">${ICON.pencil}</button><button class="iconbtn danger" data-act="remove" title="Remove" aria-label="Remove">${ICON.trash}</button></span>
    </div></div>`;
}

/* one dense row for the list view — same data as a card, scan-optimised */
function listRow(d, showSite = true) {
  const st = d.status || {}, sheets = st.sheets || [], off = !d.online, printing = st.state === "printing", light = d.kind === "dock-light";
  const name = d.name || st.printer || (light ? "Dock Light" : d.kind === "dock" ? "Dock" : "Go");
  const sub = [light ? "Dock Light" : d.kind === "go" ? "Go" : "Dock", showSite && d.site ? d.site : ""].filter(Boolean).join(" · ");
  const phones = (d.mirror_phones || []).length;
  const count = d.print2go ? `${phones} phone${phones === 1 ? "" : "s"}` : d.kind === "go" ? "—" : `${sheets.length} sheet${sheets.length === 1 ? "" : "s"}`;
  const low = sheets.filter(x => x.battery_volts != null && x.battery_volts * 1000 < 2700).length;
  const status = d.approved === false ? `<span class="fstat warn">${ICON.warn}Waiting</span>`
    : off ? `<span class="fstat off"><span class="dot"></span>seen ${ago(d.last_seen)}</span>`
    : printing ? `<span class="fstat"><span class="presence printing"><span class="dot"></span></span>printing</span>`
    : `<span class="fstat"><span class="presence"><span class="dot"></span></span>online</span>`;
  const openBtn = d.kind !== "go" && st.lan
    ? `<a class="iconbtn" href="${esc(st.lan)}" target="_blank" rel="noopener" title="Open local page" aria-label="Open local page"${off ? ' aria-disabled="true" tabindex="-1"' : ""}>${ICON.external}</a>`
    : "";
  return `<div class="frow ${off ? "off" : ""}" data-id="${esc(d.id)}">
    <button class="fcell fname" data-act="details" title="Open details"><span class="fdart">${deviceArt(d, 34)}</span><span class="devwho"><b>${esc(name)}</b><span class="mono">${esc(sub)}</span></span></button>
    <span class="fcell">${status}</span>
    <span class="fcell mono">${d.version ? "v" + esc(d.version) : "—"}${d.target_version && d.target_version !== d.version ? ` <span class="dchip mono">↑ ${esc(d.target_version)}</span>` : ""}</span>
    <span class="fcell mono">${count}${low ? ` <span class="dchip mono warn">${low} low</span>` : ""}</span>
    <span class="fcell fact-cell"><span class="iconrow">${openBtn}<button class="iconbtn" data-act="identify" title="Find it — blink the light ring" aria-label="Find it" ${off ? "disabled" : ""}>${ICON.ping}</button><button class="iconbtn" data-act="name" title="Rename" aria-label="Rename">${ICON.pencil}</button><button class="iconbtn danger" data-act="remove" title="Remove" aria-label="Remove">${ICON.trash}</button></span></span>
  </div>`;
}
const LIST_HEAD = `<div class="frow head"><span class="fcell">Device</span><span class="fcell">Status</span><span class="fcell">Software</span><span class="fcell">Sheets</span><span class="fcell"></span></div>`;

function render() {
  const list = VIEW === "list";
  el("fleet").classList.toggle("aslist", list);
  const fn = (FILTERS.find(([k]) => k === FILTER) || FILTERS[0])[2];
  let shown = S.devices.filter(fn);
  if (Q) shown = shown.filter(d => [d.name, (d.status || {}).printer, d.site, d.id].filter(Boolean).join(" ").toLowerCase().includes(Q));

  // group by named site only — devices with no site list plainly, no "No site" header
  const bySite = new Map();
  for (const d of shown) { const k = d.site || ""; if (!bySite.has(k)) bySite.set(k, []); bySite.get(k).push(d); }
  const named = [...bySite.entries()].filter(([k]) => k).sort((a, b) => a[0].localeCompare(b[0]));
  const nosite = bySite.get("") || [];

  const renderDevs = (devs) => list
    ? `<div class="flist">${LIST_HEAD}${devs.map(d => listRow(d, false)).join("")}</div>`
    : devs.map(d => card(d, false)).join("");

  let html = "";
  if (named.length) {
    if (nosite.length) html += renderDevs(nosite);
    for (const [site, devs] of named) html += `<div class="sitehead">${esc(site)}<span>${devs.length}</span></div>` + renderDevs(devs);
  } else {
    html = renderDevs(shown);
  }

  const filtered = Q || FILTER !== "all";
  setHTML("fleet", html
    + (!shown.length && filtered ? `<div class="empty-hint" style="grid-column:1/-1">No devices match${Q ? ` “${esc(Q)}”` : " this filter"}.</div>` : "")
    + (!filtered && !list ? `<button class="addcard" type="button" onclick="openModal('claim')"><span class="plus">${ICON.plus}</span><span>${S.devices.length ? "Claim a device" : "Claim your first device"}</span></button>` : "")
    + (!filtered && list && S.devices.length ? `<button class="btn outline claimline" type="button" onclick="openModal('claim')">${ICON.plus}<span>Claim a device</span></button>` : "")
    + (S.devices.length ? "" : `<div class="empty-hint" style="grid-column:1/-1">A Dock shows its claim code on its settings page under <b>RePaper Cloud</b> once it is pointed at this cloud. Enter the code here and it joins your fleet.</div>`));
}

function renderAlerts(alerts) {
  setHTML("alerts", (alerts || []).map(a =>
    `<div class="notice ${a.level === "err" ? "err" : ""}">${a.level === "err" ? ICON.x : ICON.warn}<div><b>${esc(a.title)}</b><span>${esc(a.text)}</span></div></div>`).join(""));
}

async function load() {
  const [fleet, al] = await Promise.all([api("/api/fleet"), api("/api/alerts").catch(() => null)]);
  S = { ...S, ...fleet };
  renderFilters();
  if (al) renderAlerts(al.alerts);
  if (!document.querySelector("dialog[open]")) render();
  if (OPEN_DEVICE) { const id = OPEN_DEVICE; OPEN_DEVICE = null; if (S.devices.find(x => x.id === id)) openDetails(id); }
  if (OPEN_CLAIM) { OPEN_CLAIM = false; openModal("claim"); }
}

function openDetails(id) {
  const d = S.devices.find(x => x.id === id); if (!d) return;
  const st = d.status || {}, sheets = st.sheets || [];
  el("detName").textContent = d.name || st.printer || d.kind;
  api(`/api/devices/${id}`).then(full => {
    const rows = sheets.map(sheetRow).join("");
    const tl = (full.events || []).map(e => {
      const t = new Date(e.at * 1000);
      return `<div class="tl-item"><span class="tl-dot"></span><span class="tl-time mono">${t.toLocaleDateString([], { day: "numeric", month: "short" })} ${t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span><span class="tl-text">${esc(e.type)}${e.data ? " · " + esc(e.data) : ""}</span></div>`;
    }).join("");
    const p2gCard = (() => {
      // use `full` (the just-fetched detail), not the possibly-stale list item `d` — a phone
      // that paired after the fleet page loaded would otherwise be missing here
      if (full.print2go) {
        const ph = full.mirror_phones || [];
        const rows2 = ph.length ? ph.map(p => `<div class="dsheet"><span class="sname"><b>${esc(p.name)}</b></span><span class="spill ${p.online ? "ok" : "off"}" style="padding:4px 10px"><span class="d"></span>${p.online ? "online" : "offline"}</span></div>`).join("")
          : `<div class="devmeta">No phones are printing from this Dock yet. Turn on Print2Go on a RePaper Go device and pick this Dock.</div>`;
        return `<section class="det-sec"><h2>Print2Go</h2><p class="devmeta" style="margin:0 0 10px">Jobs sent to this Dock can also print on these phones — first to grab one prints it.</p><div class="dsheets">${rows2}</div><div class="hint" style="color:var(--text-3);font-size:.75rem;margin-top:8px">Pages travel through RePaper Cloud and are deleted on delivery.</div></section>`;
      }
      if (full.kind === "go" && full.mirror_from_name) return `<section class="det-sec"><h2>Print2Go</h2><p class="devmeta" style="margin:0">Prints jobs sent to <b>${esc(full.mirror_from_name)}</b>.</p></section>`;
      return "";
    })();
    const lanHost = st.lan ? st.lan.replace(/^https?:\/\//, "").replace(/\/$/, "") : "";
    el("detBody").innerHTML = `
      <div class="det-hero">
        <span class="det-art">${deviceArt(d, 68)}</span>
        <div class="det-headline">${statusPill(d)}<div class="det-sub mono">${esc([st.printer, d.site].filter(Boolean).join(" · ")) || esc(d.kind)}${d.version ? " · v" + esc(d.version) : ""}</div></div>
      </div>
      <div class="det-actions">
        ${st.lan ? `<a class="btn primary openbtn" href="${esc(st.lan)}" target="_blank" rel="noopener">${ICON.external}<span>Open device page</span></a>` : ""}
        <button class="btn soft" onclick="identifyDevice('${esc(d.id)}', this)" title="Blinks this Dock's light ring so you can spot it in the room" ${d.online ? "" : "disabled"}>${ICON.ping}<span>Find it</span></button>
        <button class="btn soft" onclick="remoteReboot('${esc(d.id)}', this)" title="Restart the device — it reports back in about a minute" ${d.online ? "" : "disabled"}>${ICON.restart}<span>Restart</span></button>
      </div>
      ${st.lan ? `<p class="det-note">${ICON.globe}<span>Opens only on the Dock's own network — <b>${esc(lanHost)}</b></span></p>` : ""}
      <div class="dstats det-stats">${deviceStats(d).join("")}</div>
      <div class="det-card"><div class="facts grid">${
        fact("Kind", d.kind === "dock-light" ? "Dock Light" : d.kind) + fact("Reader", st.identifier)
        + (d.dormant ? fact("Status", "signed out (seat kept)") : "")
        + (d.kind === "go" && d.mirror_from_name ? fact("Prints from", d.mirror_from_name) : "")
        + fact("Claimed", d.claimed_at ? new Date(d.claimed_at * 1000).toLocaleDateString() : "")
        + fact("Device id", d.id)
      }</div></div>
      ${p2gCard}
      ${sheets.length ? `<section class="det-sec"><h2>Sheets</h2><div class="dsheets">${rows}</div></section>` : ""}
      ${tl ? `<section class="det-sec"><h2>Activity</h2><div class="det-timeline">${tl}</div></section>` : ""}
      <section class="det-sec"><div class="det-sechead"><h2>Diagnostics</h2><button class="btn soft small" onclick="requestDiag('${esc(d.id)}', this)" ${d.online ? "" : "disabled"}>${ICON.doc}<span>Request logs</span></button></div>${full.diag ? `<pre class="diaglog mono">${esc(full.diag.log)}</pre><div class="hint" style="color:var(--text-3);font-size:.75rem">captured ${ago(full.diag.at)}</div>` : `<div class="devmeta">No log yet — tap “Request logs” and it arrives in a few seconds.</div>`}</section>`;
    el("detDlg").showModal();
  }).catch(x => toast(x.message, "err"));
}
async function remoteReboot(id, b) {
  const done = busy(b, "Restarting…");
  try { await api(`/api/devices/${id}/reboot`, {}); done("Sent"); toast("The device restarts and reports back in about a minute."); }
  catch (x) { done("Failed", true); toast(x.message, "err"); }
}
async function identifyDevice(id, b) {
  const done = busy(b, "Blinking…");
  try { await api(`/api/devices/${id}/identify`, {}); done("Blinking"); toast("Blinking now — find the Dock whose light ring is flashing."); }
  catch (x) { done("Failed", true); toast(x.message, "err"); }
}
async function requestDiag(id, b) {
  const done = busy(b, "Asking…");
  try { await api(`/api/devices/${id}/diag`, {}); done("Requested"); toast("The device is sending its log — reopen the details in a few seconds."); }
  catch (x) { done("Failed", true); toast(x.message, "err"); }
}

const modals = {
  claim: () => ["Claim a device", `<form class="ed" data-ed="claim">
    <p>On the Dock, open <b>Settings → RePaper Cloud</b> and point it at this cloud. Its claim code appears there.</p>
    <label for="edCode">Claim code</label><input id="edCode" name="value" class="serial" placeholder="3F9A-B2C1" maxlength="9" required autocomplete="off" style="font-family:var(--font-mono);text-transform:uppercase">
    <div class="row end"><button class="btn outline" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Claim</button></div></form>`],
  name: (d) => ["Edit device", `<form class="ed" data-ed="name" data-id="${esc(d.id)}">
    <label for="edName">Name</label><input id="edName" name="value" value="${esc(d.name || (d.status || {}).printer || "")}" maxlength="63" required autocomplete="off">
    <label for="edSite">Site <span style="color:var(--text-3);font-weight:400">(optional — groups the fleet)</span></label><input id="edSite" name="site" value="${esc(d.site || "")}" maxlength="40" placeholder="e.g. Office Witten" autocomplete="off">
    <div class="row end"><button class="btn outline" type="button" data-act="close">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>`],
  remove: (d) => ["Remove device", `<form class="ed" data-ed="remove" data-id="${esc(d.id)}"><p>Remove <b>${esc(d.name || (d.status || {}).printer || d.id)}</b> from this fleet? The device keeps working on its own and can be claimed again with a fresh code.</p><div class="row end"><button class="btn outline" type="button" data-act="close">Keep</button><button class="btn danger" type="submit">${ICON.trash}Remove</button></div></form>`],
};
function openModal(kind, id) {
  const d = S.devices.find(x => x.id === id) || {};
  const [title, html] = modals[kind](d);
  setModal(title, html);
}
el("edDlg").addEventListener("click", e => { const b = e.target.closest("[data-act=close]"); if (b) { closeModal(); render(); } });
el("edDlg").addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, kind = f.dataset.ed, id = f.dataset.id, sb = f.querySelector("button[type=submit]");
  const done = busy(sb, {claim: "Claiming…", name: "Saving…", remove: "Removing…"}[kind]);
  try {
    if (kind === "claim") {
      const r = await api("/api/claim", {code: f.elements.value.value});
      done("Claimed"); await load(); toast(`${r.device.name || "Device"} joined the fleet.`); await wait(400); closeModal(); render();
      const c = el("fleet").querySelector(`[data-id="${CSS.escape(r.device.id)}"]`); if (c) c.classList.add("enter", "hi");
      return;
    }
    if (kind === "remove") { await api(`/api/devices/${id}/remove`, {}); el("edDlg").close(); const c = el("fleet").querySelector(`[data-id="${CSS.escape(id)}"]`); if (c) { c.classList.add("leave"); await wait(240); } toast("Removed."); await load(); render(); return; }
    await api(`/api/devices/${id}`, {name: f.elements.value.value.trim(), site: f.elements.site.value}); done("Saved"); await load(); toast("Saved."); await wait(400); closeModal(); render();
  } catch (x) { done(kind === "claim" ? "Not claimed" : "Failed", true); const i = f.querySelector("input"); if (i) shake(i); toast(x.message, "err"); }
});
el("fleet").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.closest("[data-id]").dataset.id, act = b.dataset.act;
  if (act === "details") return openDetails(id);
  if (modals[act]) return openModal(act, id);
  if (act === "approve") {
    const done = busy(b, "Approving…");
    try { await api(`/api/devices/${id}/approve`, {}); done("Approved"); toast("Device approved — it can print now."); load(); }
    catch (x) { done("Failed", true); toast(x.message, "err"); }
    return;
  }
  if (act === "identify") {
    b.disabled = true;
    try { await api(`/api/devices/${id}/identify`, {}); toast("Blinking now — find the Dock whose light ring is flashing."); }
    catch (x) { toast(x.message, "err"); }
    b.disabled = false;
  }
});
load().catch(x => { if (x.message !== "signed out") toast(x.message, "err"); });
setInterval(() => load().catch(() => {}), 5000);
</script>
</body>
</html>
