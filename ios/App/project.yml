# XcodeGen spec for the RePaper Go iOS app.
# brew install xcodegen && cd ios/App && xcodegen && open RePaperGo.xcodeproj
name: RePaperGo
options:
  bundleIdPrefix: net.repaper
  deploymentTarget:
    iOS: "16.0"
packages:
  RePaperKit:
    path: ../RePaperKit
targets:
  RePaperGo:
    type: application
    platform: iOS
    sources: [Sources, Shared, Resources]
    dependencies:
      - package: RePaperKit
      - target: RePaperGoShare
    entitlements:
      path: RePaperGo.entitlements
      properties:
        com.apple.security.application-groups: [group.net.repaper.go]
        # lets iOS password managers offer repaper.schisch.net credentials in the app;
        # ?mode=developer makes dev builds validate instantly (ignored in distribution)
        com.apple.developer.associated-domains:
          - webcredentials:repaper.schisch.net?mode=developer
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: RePaper Go
        CFBundleShortVersionString: "0.1.1"
        UILaunchScreen: {}
        UIAppFonts: [Archivo.ttf, Figtree.ttf]
        NSBluetoothAlwaysUsageDescription: RePaper Go talks to your e-paper sheets over Bluetooth to print on them.
        NSCameraUsageDescription: RePaper Go scans the QR code on a sheet to add it.
        NFCReaderUsageDescription: Tap a sheet with your iPhone to print on it.
        com.apple.developer.nfc.readersession.formats: [NDEF]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.repaper.go.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 8DPLCLHB27
        CODE_SIGN_STYLE: Automatic

  # the share-sheet intake: spools PDFs/images into the app group's jobs folder
  RePaperGoShare:
    type: app-extension
    platform: iOS
    sources: [ShareExt, Shared]
    entitlements:
      path: RePaperGoShare.entitlements
      properties:
        com.apple.security.application-groups: [group.net.repaper.go]
    info:
      path: ShareExt/Info.plist
      properties:
        CFBundleDisplayName: RePaper Go
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.repaper.go.ios.share
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: 8DPLCLHB27
        CODE_SIGN_STYLE: Automatic
