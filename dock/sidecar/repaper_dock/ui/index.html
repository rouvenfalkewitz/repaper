1112.2 6581.7 1165.7Q6550.7 1219.2 6488.5 1250.2L6629.1 1512.3H6399.4L6285.3 1283.6H6021.1V1512.3ZM6021.1 1133.1H6323.3Q6360 1133.1 6381.9 1111.1Q6403.9 1089 6403.9 1052.5Q6403.9 1027.9 6394 1010.6Q6384.1 993.4 6366.1 984.5Q6348.2 975.7 6323.3 975.7H6021.1Z"/></svg>
    <div class="actions"><div class="printer"><b id="printer">RePaper Dock</b><span id="addr"></span></div>

  </header>

  <section class="card" id="job"></section>

  <h2>Sheets</h2>
  <div class="sheets" id="sheets"></div>

  <h2>Recent</h2>
  <div class="card list" id="recent"></div>

  <footer>
    <svg class="m" viewBox="0 0 2338.6 2338.6" aria-hidden="true"><path class="ring" fill-rule="evenodd" d="M0 1169.3a1169.3 1169.3 0 1 0 2338.6 0a1169.3 1169.3 0 1 0 -2338.6 0ZM203.6 1169.3a965.7 965.7 0 1 0 1931.3 0a965.7 965.7 0 1 0 -1931.3 0Z"/><path class="letters" d="M355.9 1512.3V824.7H928.2Q1003.3 824.7 1052.6 855.6Q1101.8 886.5 1126.4 936.9Q1151 987.3 1151 1046.8Q1151 1112.2 1120.1 1165.7Q1089.1 1219.2 1026.9 1250.2L1167.5 1512.3H937.8L823.8 1283.6H559.5V1512.3ZM559.5 1133.1H861.7Q898.4 1133.1 920.4 1111.1Q942.3 1089 942.3 1052.5Q942.3 1027.9 932.4 1010.6Q922.5 993.4 904.6 984.5Q886.7 975.7 861.7 975.7H559.5Z M1257.9 1512.3V824.7H1974.7V975.7H1462.1V1091.1H1910.8V1237.2H1462.1V1361.4H1982.7V1512.3Z"/></svg>
    <span id="foot"></span>
  </footer>
</div>
<script>
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let last = "";
function pillFor(state) {
  return { "ready": ["", "Ready"], "job-waiting": ["wait", "Waiting for sheet"], "printing": ["busy", "Printing"], "printed": ["done", "Printed"],
           "error": ["err", "Failed"], "setup": ["setup", "Setup"] }[state] || ["", state];
}
function fmtAgo(ts, now) { if (!ts) return ""; const d = Math.max(0, (now || Date.now()/1000) - ts); if (d < 60) return "just now"; if (d < 3600) return Math.round(d/60) + " min ago"; if (d < 86400) return Math.round(d/3600) + " h ago"; return Math.round(d/86400) + " d ago"; }
const STEPS = [["looking", "Find sheet"], ["connect", "Connect"], ["send", "Send"], ["refresh", "Refresh"]];
function stepIndex(phase) { phase = (phase || "").toLowerCase(); if (phase.startsWith("printed")) return 4; if (phase.includes("refresh")) return 3; if (phase.includes("sending") || phase.includes("rendering")) return 2; if (phase.includes("connect")) return 1; return 0; }
function stepper(phase, since, now) {
  const i = stepIndex(phase), t = since ? Math.max(0, Math.round((now || Date.now()/1000) - since)) : null;
  const label = { 0: "Looking for the sheet", 1: "Connecting", 2: "Sending the page", 3: "Sheet is refreshing", 4: "Printed" }[i];
  const detail = i === 3 ? "the panel rewrites itself — about 20 seconds" : i === 2 ? "over Bluetooth" : i === 1 ? "authenticating with the sheet" : i === 0 ? "scanning nearby" : "";
  return `<div class="stepper" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${i}">` + STEPS.map(([k, l], n) =>
    `<div class="step ${n < i ? "done" : n === i ? "active" : ""}"><i></i><span>${l}</span></div>`).join("") + `</div>
    <div class="live"><span class="dot"></span><div><b>${label}</b>${detail ? `<span>${detail}</span>` : ""}</div>${t != null ? `<span class="mono time">${t} s</span>` : ""}</div>`;
}
function pages(j) {
  const done = j.printed || 0, cur = j.next_page || j.pages, n = j.pages;
  return `<div class="pages"><span class="count">Page <b>${cur}</b> of ${n}</span><span class="segs">${Array.from({length: n}, (_, k) => `<i class="${k < done ? "done" : k === cur - 1 ? "cur" : ""}"></i>`).join("")}</span></div>`;
}
function frame(w, h, src, palette) {
  const ar = (w / h).toFixed(3);
  return `<div class="frame" style="aspect-ratio:${ar}">${src ? `<img src="${src}" alt="">` : `<div class="blank"></div>`}</div>`;
}
function dots(palette) { const c = {BW: ["#FFFFFF", "#000000"], BWR: ["#FFFFFF", "#000000", "#C8102E"], BWRY: ["#FFFFFF", "#000000", "#C8102E", "#F2C400"]}[palette] || ["#FFFFFF", "#000000"]; return `<span class="dots" title="${palette}">${c.map(x => `<i style="background:${x}"></i>`).join("")}</span>`; }
function render(s) {
  el("printer").textContent = s.printer; el("addr").textContent = s.address || "";
  el("foot").textContent = `RePaper Dock · ${s.version || ""} · identifier: ${s.identifier}`;
  const j = s.job, now = s.now;
  let html;
  if (!j) {
    html = `<div class="empty"><div class="ringwrap"><svg class="ring-hero" viewBox="0 0 2338.6 2338.6" aria-hidden="true"><path class="ring" fill-rule="evenodd" d="M0 1169.3a1169.3 1169.3 0 1 0 2338.6 0a1169.3 1169.3 0 1 0 -2338.6 0ZM203.6 1169.3a965.7 965.7 0 1 0 1931.3 0a965.7 965.7 0 1 0 -1931.3 0Z"/></svg></div>
            <div><span class="pill">Ready</span><div class="title">Ready to print</div>
            <div class="meta">Print to <b>${esc(s.printer)}</b> from any device on this network — the page shows up here.</div>
            <div class="chips"><span>AirPrint</span><span>IPP Everywhere</span><span>Mopria</span></div></div></div>`;
  } else if (s.state === "printing") {
    html = `<span class="pill busy">Printing</span><div class="title">${esc(j.name)}</div>${pages(j)}
            ${stepper(s.phase, s.printing_since, now)}
            <div class="preview">${frame(4, 3, `/preview/${j.id}/${j.next_page || j.pages}`)}</div>`;
  } else if (s.state === "printed") {
    html = `<span class="pill done">Printed</span><div class="title">${esc(j.name)}</div><div class="meta">${esc(s.message)}</div>`;
  } else {
    const opts = Object.entries(s.sheets).map(([k, v]) => `<option value="${esc(k)}">${esc(v.name || k)} · ${esc(v.size)}</option>`).join("");
    const notice = s.identifier === "manual"
      ? `<div class="notice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div><b>No sheet reader on this Dock</b><span>Choose the sheet below and press Print — that is the tap.</span></div></div>`
      : `<div class="notice info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><div><b>Hold the sheet to the Dock</b><span>If the reader doesn't pick it up, choose it below and press Print.</span></div></div>`;
    const err = s.error ? `<div class="notice err"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6m0-6 6 6"/></svg><div><b>Not printed</b><span>${esc(s.error)}</span></div></div>` : "";
    html = `<div class="card-head"><span class="pill wait">Waiting for sheet</span>
              <form method="post" action="/cancel"><button class="btn ghost small" type="submit" name="job" value="${esc(j.id)}">Discard</button></form></div>
            <div class="title">${esc(j.name)}</div>${pages(j)}
            <div class="meta">${j.user ? "from " + esc(j.user) + " · " : ""}${fmtAgo(j.created, now)}</div>
            <div class="preview">${frame(4, 3, `/preview/${j.id}/${j.next_page}`)}</div>
            ${err}${notice}
            <form class="row tap" method="post" action="/tap"><select name="sheet" aria-label="Sheet">${opts}</select><button class="btn primary" type="submit" ${opts ? "" : "disabled"}>Print</button></form>`;
  }
  el("job").innerHTML = html;
  el("sheets").innerHTML = Object.entries(s.sheets).map(([k, v]) => {
    const mv = v.battery_volts, pct = mv == null ? null : Math.max(0, Math.min(100, (mv * 1000 - 2400) / 6));
    const low = mv != null && mv * 1000 < (v.min_battery_mv || 2700), hw = v.hw || {};
    const bat = mv == null ? `<div class="bat"><i><b style="width:0"></b></i><span>${v.online === false ? "not in range" : "battery —"}</span></div>`
                           : `<div class="bat ${low ? "low" : ""}"><i><b style="width:${pct}%"></b></i><span>${mv.toFixed(2)} V${low ? " · replace cell" : ""}${v.temperature_c != null ? " · " + v.temperature_c.toFixed(0) + " °C" : ""}</span></div>`;
    const hwline = [hw.inch ? hw.inch + '"' : null, hw.mm, hw.mcu, hw.board, hw.firmware ? "fw " + hw.firmware : null].filter(Boolean).join(" · ");
    const last = v.last ? `<span class="mono">showing: ${esc(v.last.job)} · ${fmtAgo(v.last.at, now)}</span>` : `<span class="mono">nothing printed yet</span>`;
    return `<div class="sheet">${frame(v.width, v.height, v.last ? `/sheet-image/${esc(k)}?t=${v.last.at}` : null, v.palette)}
      <div class="sheet-head"><b>${esc(v.name || k)}</b>${dots(v.palette)}</div>
      <span class="mono">${v.width}×${v.height} · ${esc(v.palette)} · ${esc(v.transport)}</span>
      ${hwline ? `<span class="mono">${esc(hwline)}</span>` : ""}
      ${bat}${last}</div>`;
  }).join("") || `<div class="sheet"><b>No sheets yet</b><span class="mono">Add one in Settings</span></div>`;
  const rec = (s.recent || []).slice().reverse();
  const row = r => {
    const [c, l] = { done: ["done", "Printed"], cancelled: ["", "Discarded"], failed: ["err", "Failed"] }[r.state] || ["", r.state];
    const last = r.printed && r.printed.length ? r.printed[r.printed.length - 1] : null;
    const sheets = r.printed ? [...new Set(r.printed.map(p => p.sheet))].join(", ") : "";
    return `<details class="job"><summary><span class="jname">${esc(r.name)}</span><span class="jwhen mono">${fmtAgo(last ? last.at : r.created, now)}</span><span class="pill ${c}">${l}</span></summary>
      <div class="jdetail kv"><span>pages</span><span>${r.printed ? r.printed.length : 0} of ${r.pages} printed</span>${sheets ? `<span>sheet</span><span>${esc(sheets)}</span>` : ""}${r.user ? `<span>from</span><span>${esc(r.user)}</span>` : ""}<span>received</span><span>${fmtAgo(r.created, now)}</span>${r.error ? `<span>note</span><span>${esc(r.error)}</span>` : ""}</div></details>`;
  };
  const head = rec.slice(0, 3), rest = rec.slice(3);
  el("recent").innerHTML = rec.length ? head.map(row).join("") + (rest.length ? `<details class="more"><summary>Show ${rest.length} more</summary>${rest.map(row).join("")}</details>` : "") : `<div class="meta">Nothing printed yet.</div>`;
async function tick() {
  try {
    const s = await (await fetch("/api/status", {cache: "no-store"})).json();
    const sig = JSON.stringify([s.state, s.job && s.job.id, s.job && s.job.next_page, s.message, Object.keys(s.sheets).length, s.recent && s.recent.length, Object.values(s.sheets).map(v => [v.battery_volts, v.online, v.last && v.last.at, v.hw && v.hw.firmware])]);
    if (sig !== last) { render(s); last = sig; }
    else if (s.state === "printing") { const st = el("job").querySelector(".stepper"); if (st) { const wrap = document.createElement("div"); wrap.innerHTML = stepper(s.phase, s.printing_since, s.now); st.replaceWith(wrap.firstChild); el("job").querySelector(".phase-line").replaceWith(wrap.lastChild); } }
  } catch (e) {}
}
if (window.__STATE__) render(window.__STATE__); else { tick(); setInterval(tick, 1000); }
</script>
