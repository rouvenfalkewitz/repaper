[project]
name = "repaper-dock"
version = "0.0.1"
description = "RePaper Dock sidecar: job spool, rendering and sheet transports (the printer side is PAPPL / ippeveprinter)"
requires-python = ">=3.12"
dependencies = ["pillow>=11", "py-opendisplay"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
repaper-print = "repaper_dock.cli:print_command"
repaper-dockd = "repaper_dock.cli:dockd"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repaper_dock*"]
